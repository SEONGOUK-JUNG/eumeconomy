<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>이음경제 접속 통계</title>
<style>
  :root{--navy:#123d4c;--term:#0a232d;--term2:#0e2c38;--line:#1b4351;--bar:#4d616b;
        --text:#e8eef0;--dim:#8fa6b0;--gold:#c9a24a;--up:#ff6b6b;--down:#6aa8ff}
  *{box-sizing:border-box}
  body{margin:0 auto;background:var(--term);color:var(--text);max-width:1180px;
       padding:22px 16px 64px;line-height:1.6;
       font-family:"Noto Sans KR","Malgun Gothic",-apple-system,sans-serif}
  h1{font-size:21px;margin:0 0 3px;color:#fff;letter-spacing:-.01em}
  h1 span{color:var(--gold)}
  .sub{color:var(--dim);font-size:13px;margin-bottom:22px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(152px,1fr));gap:10px;margin-bottom:8px}
  .card{background:var(--term2);border:1px solid var(--line);border-left:2px solid var(--bar);padding:13px 15px}
  .card.hi{border-left-color:var(--gold)}
  .card .lbl{font-size:11px;color:var(--dim);letter-spacing:.06em;margin-bottom:5px}
  .card .val{font-size:25px;font-weight:700;font-family:"JetBrains Mono",Consolas,monospace;letter-spacing:-.02em}
  .card .val small{font-size:12px;color:var(--dim);font-weight:500;font-family:inherit}
  .card .hint{font-size:11px;color:#6d8490;margin-top:3px}
  h2{font-size:12px;margin:26px 0 9px;color:var(--gold);letter-spacing:.1em;
     border-bottom:1px solid var(--line);padding-bottom:6px;font-weight:700}
  h2 em{font-style:normal;color:var(--dim);font-weight:400;letter-spacing:0;font-size:11px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:7px 8px;text-align:right;border-bottom:1px solid rgba(27,67,81,.6);white-space:nowrap}
  th:first-child,td:first-child{text-align:left}
  th{color:var(--dim);font-weight:600;font-size:11px;letter-spacing:.05em}
  td.path{max-width:430px;overflow:hidden;text-overflow:ellipsis;
          font-family:"JetBrains Mono",Consolas,monospace;font-size:12px}
  td.path a{color:var(--text);text-decoration:none}
  td.path a:hover{color:var(--gold);text-decoration:underline}
  .bar{height:6px;background:var(--gold);display:inline-block;min-width:2px;vertical-align:middle;opacity:.75}
  .wrap{overflow-x:auto;background:var(--term2);border:1px solid var(--line);padding:3px 12px}
  .zero{color:#54686f}
  .err{background:#2a1416;border:1px solid #6b3340;padding:15px;color:#ff9ba6}
  .foot{margin-top:28px;color:#6d8490;font-size:12px;line-height:1.8;
        border-top:1px solid var(--line);padding-top:14px}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:780px){.cols{grid-template-columns:1fr}body{padding:16px 12px 48px}}
  a{color:var(--gold)}
</style>
</head>
<body>
<h1>이음경제 <span>접속 통계</span></h1>
<div class="sub" id="sub">불러오는 중…</div>
<div id="app"></div>

<script>
/* 접속 키는 주소에 ?key=... 로 넣는다. 기본값은 비워 두고 물어본다. */
const Q = new URLSearchParams(location.search);
const KEY = Q.get('key') || '';
const DAYS = Math.min(Math.max(Number(Q.get('days')) || 30, 1), 90);
const API = 'https://eumeconomy-stats.koreagwangju.workers.dev/stats?days=' + DAYS
          + '&key=' + encodeURIComponent(KEY);

const SECTION = { home:'1면(터미널)', world:'세계경제', asia:'아시아경제', korea:'한국경제',
  china:'중국경제', materials:'원자재', macro:'환율·금리', trade:'무역·공급망',
  beauty:'K-뷰티', semi:'반도체', data:'데이터', press:'보도자료', feature:'특집',
  market:'시세', newsroom:'편집국', policy:'알림·정책', about:'소개', stats:'통계 화면', other:'기타' };
const KIND = { home:'1면', index:'지면 목록', article:'기사' };
const PLAT = { desktop:'PC', mobile:'모바일', tablet:'태블릿' };
const FLAG = { KR:'한국', US:'미국', JP:'일본', CN:'중국', HK:'홍콩', TW:'대만', SG:'싱가포르',
  VN:'베트남', IN:'인도', DE:'독일', GB:'영국', FR:'프랑스', CA:'캐나다', AU:'호주', XX:'확인 안 됨' };

function esc(s){ const d=document.createElement('div'); d.textContent=String(s); return d.innerHTML; }
function n(v){ return Number(v||0).toLocaleString('ko-KR'); }
function card(l,v,u,hint,hi){
  return '<div class="card'+(hi?' hi':'')+'"><div class="lbl">'+esc(l)+'</div><div class="val">'
    + n(v) + (u?' <small>'+esc(u)+'</small>':'') + '</div>'
    + (hint?'<div class="hint">'+esc(hint)+'</div>':'') + '</div>';
}
function row(label,v,max,cls,href){
  const name = href ? '<a href="'+esc(href)+'" target="_blank" rel="noopener">'+esc(label)+'</a>' : esc(label);
  return '<tr><td'+(cls?' class="'+cls+'"':'')+'>'+name+'</td><td><span class="bar" style="width:'
    + Math.round(v/Math.max(1,max)*120) + 'px"></span> ' + n(v) + '</td></tr>';
}
function none(){ return '<tr><td class="zero" colspan="2">아직 기록이 없습니다</td></tr>'; }
function topN(o,k){ return Object.entries(o||{}).sort((a,b)=>b[1]-a[1]).slice(0,k); }
function merge(days,k){ const o={}; days.forEach(d=>Object.entries(d[k]||{}).forEach(([a,b])=>{o[a]=(o[a]||0)+b;})); return o; }

if (!KEY) {
  document.getElementById('sub').textContent = '';
  document.getElementById('app').innerHTML =
    '<div class="err">접속 키가 없습니다. 주소 끝에 <code>?key=</code> 를 붙여 여십시오.</div>';
} else {
fetch(API).then(r=>{
  if(!r.ok) throw new Error(r.status===401 ? '접속 키가 맞지 않습니다' : '서버 오류 '+r.status);
  return r.json();
}).then(function(d){
  const days = d.days || [], today = days[0] || {}, all = d.all || {};
  const sum = k => days.reduce((a,x)=>a+(x[k]||0),0);
  const d7 = days.slice(0,7);
  const live = days.filter(x=>(x.total||0)>0).length;
  const perUser = (today.users||0) > 0 ? ((today.total||0)/today.users).toFixed(1) : '0';

  let h = '<h2 style="margin-top:0">오늘 <em>'+esc(today.date||'')+'</em></h2><div class="cards">'
    + card('방문자', today.users||0, '명', '오늘 들어온 브라우저 수', true)
    + card('페이지뷰', today.total||0, '회', '열린 페이지 수', true)
    + card('첫 방문', today.newUsers||0, '명', '이 신문을 처음 본 브라우저')
    + card('1인당 페이지', perUser, '회', '페이지뷰 ÷ 방문자')
    + '</div>';

  h += '<h2>최근 '+DAYS+'일</h2><div class="cards">'
    + card('7일 방문자', d7.reduce((a,x)=>a+(x.users||0),0), '명')
    + card('7일 페이지뷰', d7.reduce((a,x)=>a+(x.total||0),0), '회')
    + card(DAYS+'일 방문자', sum('users'), '명')
    + card(DAYS+'일 페이지뷰', sum('total'), '회')
    + card('하루 평균 방문자', live ? Math.round(sum('users')/live*10)/10 : 0, '명', '방문 있던 '+live+'일 기준')
    + '</div>';

  h += '<h2>누계 <em>'+(all.since?esc(all.since)+' 부터':'')+'</em></h2><div class="cards">'
    + card('총 방문자', all.newUsers||0, '명', '중복 없는 브라우저 수')
    + card('총 페이지뷰', all.total||0, '회')
    + card('방문자×일', all.userDays||0, '', '재방문이 많으면 커진다')
    + '</div>';

  const paths = merge(days,'path'), secs = merge(days,'section'), kinds = merge(days,'kind'),
        refs = merge(days,'ref'), plats = merge(days,'platform'), ctry = merge(days,'country');

  h += '<div class="cols"><div>';
  h += '<h2>많이 본 페이지 <em>'+DAYS+'일</em></h2><div class="wrap"><table>';
  const pr = topN(paths,25);
  h += pr.length ? pr.map(([k,v])=>row(k,v,pr[0][1],'path','https://eumeconomy.com'+k)).join('') : none();
  h += '</table></div>';
  h += '<h2>지면별</h2><div class="wrap"><table>';
  const sr = topN(secs,16);
  h += sr.length ? sr.map(([k,v])=>row(SECTION[k]||k,v,sr[0][1])).join('') : none();
  h += '</table></div>';
  h += '</div><div>';
  h += '<h2>유입 경로 <em>그날 첫 페이지 기준</em></h2><div class="wrap"><table>';
  const rr = topN(refs,15);
  h += rr.length ? rr.map(([k,v])=>row(
      k==='direct' ? '직접 접속·북마크·앱' : (k==='internal' ? '지면 안에서 이동' : k),
      v, rr[0][1])).join('') : none();
  h += '</table></div>';
  h += '<h2>국가</h2><div class="wrap"><table>';
  const cr = topN(ctry,12);
  h += cr.length ? cr.map(([k,v])=>row(FLAG[k]||k,v,cr[0][1])).join('') : none();
  h += '</table></div>';
  h += '<h2>기기 · 페이지 갈래</h2><div class="wrap"><table>';
  const plr = topN(plats,3), kr = topN(kinds,3);
  const mix = plr.map(([k,v])=>row(PLAT[k]||k,v,Math.max(1,plr[0]&&plr[0][1]))).join('')
            + kr.map(([k,v])=>row(KIND[k]||k,v,Math.max(1,kr[0]&&kr[0][1]))).join('');
  h += mix || none();
  h += '</table></div>';
  h += '</div></div>';

  h += '<h2>날짜별</h2><div class="wrap"><table><tr><th>날짜</th><th>방문자</th><th>페이지뷰</th>'
     + '<th>첫 방문</th><th>PC</th><th>모바일</th><th>기사</th></tr>';
  const mx = Math.max(1, ...days.map(x=>x.total||0));
  h += days.map(function(x){
    const p=x.platform||{}, k=x.kind||{}, z=(x.total||0)===0?' class="zero"':'';
    return '<tr'+z+'><td>'+esc(x.date)+'</td><td>'+n(x.users)+'</td>'
      + '<td><span class="bar" style="width:'+Math.round((x.total||0)/mx*60)+'px"></span> '+n(x.total)+'</td>'
      + '<td>'+n(x.newUsers)+'</td><td>'+n(p.desktop)+'</td><td>'+n((p.mobile||0)+(p.tablet||0))+'</td>'
      + '<td>'+n(k.article)+'</td></tr>';
  }).join('');
  h += '</table></div>';

  h += '<div class="foot">자체 집계입니다(Cloudflare Worker + KV). '
     + '<b>개인정보를 저장하지 않습니다</b> — 날짜·페이지 경로·지면 구분·국가코드·기기 구분·유입 도메인만 남기고, '
     + 'IP와 쿠키, 사용자 식별자는 받지 않습니다. 일별 기록은 90일 뒤 자동 삭제되며 누계만 남습니다.<br>'
     + '방문자는 <b>브라우저 기준</b>이어서 같은 사람이 PC와 폰으로 오면 2명으로 셉니다. '
     + '검색엔진 수집기는 자바스크립트를 실행하지 않아 대부분 집계에서 빠집니다. '
     + '같은 순간에 방문이 몰리면 몇 건이 덜 세어질 수 있습니다.<br>'
     + '주소에 <code>?days=90</code> 을 붙이면 90일까지 봅니다.</div>';

  document.getElementById('app').innerHTML = h;
  document.getElementById('sub').textContent =
    '갱신 ' + new Date().toLocaleString('ko-KR') + ' · 최근 ' + DAYS + '일';
}).catch(function(e){
  document.getElementById('sub').textContent = '';
  document.getElementById('app').innerHTML = '<div class="err">불러오지 못했습니다 — ' + esc(e.message) + '</div>';
});
}
</script>
</body>
</html>
