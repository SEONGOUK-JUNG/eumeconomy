<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-label="향료 조달 경쟁을 제한한 세 가지 행위"><rect width="960" height="520" fill="#f6f3eb"/><rect width="960" height="12" fill="#12384b"/><g font-family="Malgun Gothic, sans-serif"><text x="48" y="65" font-size="28" font-weight="700" fill="#12384b">향료 조달 경쟁을 제한한 세 가지 행위</text><text x="48" y="103" font-size="19" fill="#4e6065">2026.11.25 EU·CMA 결정</text><rect x="40" y="140" width="880" height="86" rx="8" fill="#ffffff"/><text x="62" y="174" font-size="23" fill="#12384b">가격·협상정보 공유</text><text x="530" y="175" font-size="29" font-weight="700" fill="#a1482d">가격 경쟁</text><text x="62" y="205" font-size="18" fill="#53636b">독립적인 견적의 약화</text><rect x="40" y="240" width="880" height="86" rx="8" fill="#ffffff"/><text x="62" y="274" font-size="23" fill="#12384b">원가 공개 공동 대응</text><text x="530" y="275" font-size="29" font-weight="700" fill="#a1482d">정보 접근</text><text x="62" y="305" font-size="18" fill="#53636b">비용 근거 검증의 제약</text><rect x="40" y="340" width="880" height="86" rx="8" fill="#ffffff"/><text x="62" y="374" font-size="23" fill="#12384b">담당 인력 채용 제한</text><text x="530" y="375" font-size="29" font-weight="700" fill="#a1482d">거래 유지</text><text x="62" y="405" font-size="18" fill="#53636b">고객 담당팀의 경쟁 제한</text><text x="48" y="487" font-size="17" fill="#53636b">한국 기업의 개별 피해 판정 아님</text></g></svg>