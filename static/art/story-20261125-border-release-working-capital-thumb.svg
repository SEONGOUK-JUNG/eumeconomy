<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" role="img" aria-label="OECD 지역별 무역원활화 지표 개선률, 아시아 태평양 4.4%, 유럽 중앙아시아 3.1%. 2025년 보고서에서 2022년 이후 비교. 통관시간 감소율 아님">
<rect width="760" height="230" fill="#f5f7f8"/><g font-family="sans-serif" fill="#182b3a"><text x="24" y="34" font-size="20">국경 절차 지표 개선…운임 하락률과는 다르다</text><text x="24" y="88" font-size="17">아시아·태평양</text><rect x="230" y="63" width="352" height="32" fill="#267a83"/><text x="604" y="87" font-size="18">4.4%</text><text x="24" y="143" font-size="17">유럽·중앙아시아</text><rect x="230" y="118" width="248" height="32" fill="#617f9a"/><text x="500" y="142" font-size="18">3.1%</text><text x="24" y="190" font-size="14">출처: OECD 2025년 무역원활화 평가 · 2022년 이후 변화</text><text x="24" y="214" font-size="14">지역별 지표의 개선률이며 통관시간·운임 감소율이 아니다.</text></g></svg>
