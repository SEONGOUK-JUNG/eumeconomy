<svg xmlns="http://www.w3.org/2000/svg" width="960" height="660" viewBox="0 0 960 660" role="img" aria-label="에이피알 인수자금과 현금 회수 구조"><rect width="960" height="660" fill="#f6f3eb"/><rect width="960" height="12" fill="#12384b"/><g font-family="Malgun Gothic, sans-serif"><text x="45" y="65" font-size="29" font-weight="700" fill="#12384b">닥터멜락신 인수…자금의 목적과 회수</text><text x="45" y="105" font-size="20" fill="#53636b">11월 26일 결정 · 12월 31일 취득 예정 · 완료 전</text><rect x="40" y="135" width="425" height="165" rx="9" fill="#fff"/><rect x="495" y="135" width="425" height="165" rx="9" fill="#fff"/><text x="65" y="178" font-size="24" fill="#12384b">구주 인수</text><text x="65" y="227" font-size="38" font-weight="700" fill="#a1482d">약 3200억 원</text><text x="65" y="272" font-size="21" fill="#53636b">기존 주주에게 지급 · 지배권 취득</text><text x="520" y="178" font-size="24" fill="#12384b">신주 투자</text><text x="520" y="227" font-size="38" font-weight="700" fill="#a1482d">700억 원</text><text x="520" y="272" font-size="21" fill="#53636b">브랜드501에 유입 · 사업 확장 재원</text><text x="45" y="350" font-size="24" font-weight="700" fill="#12384b">기존 사업의 현금 회수도 동시에 관리</text><rect x="40" y="375" width="880" height="185" rx="9" fill="#fff"/><text x="65" y="418" font-size="22" fill="#12384b">에이피알 1~9월 연결 영업이익</text><text x="665" y="418" font-size="27" font-weight="700" fill="#a1482d">약 5035억 원</text><text x="65" y="471" font-size="22" fill="#12384b">같은 기간 영업현금흐름</text><text x="665" y="471" font-size="27" font-weight="700" fill="#a1482d">약 537억 원</text><text x="65" y="527" font-size="20" fill="#53636b">재고·채권 증가 등으로 이익과 현금의 전환 속도에 차이</text><text x="45" y="605" font-size="18" fill="#53636b">출처: 에이피알 공식 인수 발표·DART 연결 분기보고서</text><text x="45" y="633" font-size="18" fill="#53636b">인수대금과 기존 사업 누적 실적은 서로 다른 범위의 금액</text></g></svg>