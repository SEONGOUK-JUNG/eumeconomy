<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img"><title>중국 부동산, 시작과 완성 모두 감소</title><desc>2026년 1~9월 · 전년 동기 대비 · 비주거용 건물 포함. 자료: 중국 국가통계국 10월 발표 · 건물 전체 개발 통계</desc><g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif"><rect x="0" y="0" width="960" height="600" rx="0" fill="#f2f6f5"/><rect x="0" y="0" width="960" height="12" rx="0" fill="#008477"/><text x="42" y="64" font-size="19" fill="#008477" font-weight="700" text-anchor="start">EUM ECONOMY  ·  기사별 데이터 그래픽</text><text x="42" y="112" font-size="35" fill="#103c4b" font-weight="800" text-anchor="start">중국 부동산, 시작과 완성 모두 감소</text><text x="42" y="151" font-size="22" fill="#829299" font-weight="500" text-anchor="start">2026년 1~9월 · 전년 동기 대비 · 비주거용 건물 포함</text><line x1="650" y1="211" x2="650" y2="506" stroke="#aabbb6" stroke-width="2"/><text x="45" y="251" font-size="27" fill="#103c4b" font-weight="700" text-anchor="start">개발투자</text><rect x="453.0278884462151" y="223" width="196.97211155378486" height="37" rx="5" fill="#c7363e"/><text x="894" y="251" font-size="28" fill="#c7363e" font-weight="700" text-anchor="end">-20.6%</text><text x="45" y="320" font-size="27" fill="#103c4b" font-weight="700" text-anchor="start">신규 착공면적</text><rect x="411.9123505976096" y="292" width="238.0876494023904" height="37" rx="5" fill="#c7363e"/><text x="894" y="320" font-size="28" fill="#c7363e" font-weight="700" text-anchor="end">-24.9%</text><text x="45" y="389" font-size="27" fill="#103c4b" font-weight="700" text-anchor="start">준공면적</text><rect x="410.0" y="361" width="240.0" height="37" rx="5" fill="#c7363e"/><text x="894" y="389" font-size="28" fill="#c7363e" font-weight="700" text-anchor="end">-25.1%</text><text x="45" y="510" font-size="25" fill="#829299" font-weight="500" text-anchor="start">준공면적은 실제 입주 가구 수와 다른 지표</text><line x1="42" y1="543" x2="918" y2="543" stroke="#d1dcd9" stroke-width="2"/><text x="42" y="576" font-size="19" fill="#829299" font-weight="500" text-anchor="start">자료: 중국 국가통계국 10월 발표 · 건물 전체 개발 통계</text></g></svg>