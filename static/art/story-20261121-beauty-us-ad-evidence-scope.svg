<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" role="img"><title>100점이 무엇을 평가했는가</title><desc>프리티보이 사건의 유카 앱 성분평가·완제품 효능시험 및 정부 승인 점수 아님 · BBB National Programs NAD 2026.2.19 PrettyBoy 공개 결정</desc><g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif"><rect x="0" y="0" width="1000" height="660" rx="0" fill="#f2f6f5"/><rect x="0" y="0" width="1000" height="10" rx="0" fill="#008477"/><text x="45" y="50" font-size="19" fill="#008477" font-weight="700" text-anchor="start">이음경제 · 기사별 데이터 그래픽</text><text x="45" y="93" font-size="31" fill="#103c4b" font-weight="800" text-anchor="start">100점이 무엇을 평가했는가</text><text x="45" y="164" font-size="21" fill="#819399" font-weight="500" text-anchor="start">프리티보이 사건의 유카 앱 성분평가·완제품 효능시험 및 정부 승인 점수 아님</text><text x="50" y="222" font-size="22" fill="#008477" font-weight="700" text-anchor="start">성분 기반 독자 평가 점수</text><line x1="360" y1="238" x2="360" y2="535" stroke="#c2d2cb" stroke-width="2"/><text x="50" y="263.0" font-size="24" fill="#103c4b" font-weight="700" text-anchor="start">유카 앱 성분평가</text><rect x="360" y="240.0" width="350.0" height="32" rx="3" fill="#008477"/><text x="920" y="261.0" font-size="23" fill="#008477" font-weight="700" text-anchor="end">100</text><text x="920" y="566" font-size="20" fill="#819399" font-weight="500" text-anchor="end">단위: 점(100점 만점)</text><line x1="45" y1="585" x2="955" y2="585" stroke="#cbd8d2" stroke-width="2"/><text x="45" y="616" font-size="19" fill="#819399" font-weight="500" text-anchor="start">BBB National Programs NAD 2026.2.19 PrettyBoy </text><text x="45" y="639" font-size="19" fill="#819399" font-weight="500" text-anchor="start">공개 결정</text></g></svg>