<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img">
<rect width="960" height="560" fill="#f5f3ed"/>
<g font-family="Malgun Gothic, sans-serif" fill="#172b35">
<text x="42" y="62" font-size="28" font-weight="700">중국 외자, 총액과 첨단기술의 다른 방향</text>
<path d="M42 84H918" stroke="#b28a45" stroke-width="3"/>
<rect x="42" y="112" width="876" height="98" rx="8" fill="#ffffff"/>
