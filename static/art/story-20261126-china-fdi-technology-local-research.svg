<text x="42" y="492" font-size="16">2026년 1~10월 누계 · 출처: 중국 상무부 11월20일 원통계·26일 브리핑</text>
<text x="42" y="526" font-size="15" fill="#58686a">첨단기술은 제조업·서비스업과 겹치는 분류이므로 합산하지 않음</text>
