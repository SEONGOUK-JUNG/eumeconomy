<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" role="img"><title>APEC 무역 디지털화의 세 협력 축</title><desc>2027~2030 협력 틀의 번호 붙은 분야 수, 이행 실적·점수 아님 · APEC 무역 디지털화 협력 틀 원문 II·III, 분야수 자체 집계</desc><g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif"><rect x="0" y="0" width="1000" height="660" rx="0" fill="#f2f6f5"/><rect x="0" y="0" width="1000" height="10" rx="0" fill="#008477"/><text x="45" y="50" font-size="19" fill="#008477" font-weight="700" text-anchor="start">이음경제 · 기사별 데이터 그래픽</text><text x="45" y="93" font-size="31" fill="#103c4b" font-weight="800" text-anchor="start">APEC 무역 디지털화의 세 협력 축</text><text x="45" y="164" font-size="21" fill="#819399" font-weight="500" text-anchor="start">2027~2030 협력 틀의 번호 붙은 분야 수, 이행 실적·점수 아님</text><text x="50" y="222" font-size="22" fill="#008477" font-weight="700" text-anchor="start">협력 분야 수</text><line x1="360" y1="238" x2="360" y2="535" stroke="#c2d2cb" stroke-width="2"/><text x="50" y="263.0" font-size="24" fill="#103c4b" font-weight="700" text-anchor="start">정책환경</text><rect x="360" y="240.0" width="210.0" height="32" rx="3" fill="#008477"/><text x="920" y="261.0" font-size="23" fill="#008477" font-weight="700" text-anchor="end">3</text><text x="50" y="358.0" font-size="24" fill="#103c4b" font-weight="700" text-anchor="start">정책교류</text><rect x="360" y="335.0" width="350.0" height="32" rx="3" fill="#008477"/><text x="920" y="356.0" font-size="23" fill="#008477" font-weight="700" text-anchor="end">5</text><text x="50" y="453.0" font-size="24" fill="#103c4b" font-weight="700" text-anchor="start">무역원활화</text><rect x="360" y="430.0" width="280.0" height="32" rx="3" fill="#008477"/><text x="920" y="451.0" font-size="23" fill="#008477" font-weight="700" text-anchor="end">4</text><text x="920" y="566" font-size="20" fill="#819399" font-weight="500" text-anchor="end">단위: 개 분야</text><line x1="45" y1="585" x2="955" y2="585" stroke="#cbd8d2" stroke-width="2"/><text x="45" y="616" font-size="19" fill="#819399" font-weight="500" text-anchor="start">APEC 무역 디지털화 협력 틀 원문 II·III, 분야수 자체 집계</text></g></svg>