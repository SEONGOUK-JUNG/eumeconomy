<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img"><title>수입박람회, 전시와 판매의 요건 구분</title><desc>제9회 CIIE · 2026년 11월 5~10일 · 통관 구조도. 자료: 중국 해관총서 제128호 공고 · 전시 편의가 판매 허가를 대신하지 않음</desc><g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif"><rect x="0" y="0" width="960" height="600" rx="0" fill="#f2f6f5"/><rect x="0" y="0" width="960" height="12" rx="0" fill="#008477"/><text x="42" y="64" font-size="19" fill="#008477" font-weight="700" text-anchor="start">EUM ECONOMY  ·  기사별 데이터 그래픽</text><text x="42" y="112" font-size="35" fill="#103c4b" font-weight="800" text-anchor="start">수입박람회, 전시와 판매의 요건 구분</text><text x="42" y="151" font-size="22" fill="#829299" font-weight="500" text-anchor="start">제9회 CIIE · 2026년 11월 5~10일 · 통관 구조도</text><rect x="42" y="226" width="277" height="175" rx="5" fill="white"/><text x="62" y="278" font-size="34" fill="#008477" font-weight="800" text-anchor="start">전시</text><text x="62" y="335" font-size="21" fill="#103c4b" font-weight="500" text-anchor="start">행사·전시 용도 요건</text><rect x="345" y="226" width="277" height="175" rx="5" fill="white"/><text x="365" y="278" font-size="34" fill="#008477" font-weight="800" text-anchor="start">시용·시식</text><text x="365" y="335" font-size="21" fill="#103c4b" font-weight="500" text-anchor="start">품목·수량·용도 제한</text><rect x="648" y="226" width="277" height="175" rx="5" fill="white"/><text x="668" y="278" font-size="34" fill="#008477" font-weight="800" text-anchor="start">시험 판매</text><text x="668" y="335" font-size="21" fill="#103c4b" font-weight="500" text-anchor="start">별도 등록·심사 요건</text><text x="45" y="461" font-size="32" fill="#103c4b" font-weight="800" text-anchor="start">폐막 이후 판매는 경로별로 구분</text><text x="45" y="505" font-size="25" fill="#008477" font-weight="500" text-anchor="start">일반 수입 절차  /  요건을 갖춘 보세 소매 판매</text><line x1="42" y1="543" x2="918" y2="543" stroke="#d1dcd9" stroke-width="2"/><text x="42" y="576" font-size="19" fill="#829299" font-weight="500" text-anchor="start">자료: 중국 해관총서 제128호 공고 · 전시 편의가 판매 허가를 대신하지 않음</text></g></svg>