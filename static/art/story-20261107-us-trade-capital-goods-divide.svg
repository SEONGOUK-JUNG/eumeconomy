<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img"><title>미국 무역, 총액과 실물 수요의 차이</title><desc>2026년 9월 · 국제수지 기준 / 실질 상품수지 별도. 자료: BEA·미국 인구조사국 11월 4일 발표 · 금액과 증감률 구분</desc><g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif"><rect x="0" y="0" width="960" height="600" rx="0" fill="#f2f6f5"/><rect x="0" y="0" width="960" height="12" rx="0" fill="#008477"/><text x="42" y="64" font-size="19" fill="#008477" font-weight="700" text-anchor="start">EUM ECONOMY  ·  기사별 데이터 그래픽</text><text x="42" y="112" font-size="35" fill="#103c4b" font-weight="800" text-anchor="start">미국 무역, 총액과 실물 수요의 차이</text><text x="42" y="151" font-size="22" fill="#829299" font-weight="500" text-anchor="start">2026년 9월 · 국제수지 기준 / 실질 상품수지 별도</text><rect x="42" y="219" width="277" height="227" rx="5" fill="#ffffff"/><rect x="42" y="219" width="277" height="6" rx="0" fill="#103c4b"/><text x="62" y="264" font-size="25" fill="#103c4b" font-weight="700" text-anchor="start">상품·서비스 적자</text><text x="62" y="338" font-size="43" fill="#103c4b" font-weight="800" text-anchor="start">1,050억 달러</text><text x="62" y="393" font-size="20" fill="#829299" font-weight="500" text-anchor="start">8월 1,057억 달러</text><rect x="343" y="219" width="277" height="227" rx="5" fill="#ffffff"/><rect x="343" y="219" width="277" height="6" rx="0" fill="#008477"/><text x="363" y="264" font-size="25" fill="#103c4b" font-weight="700" text-anchor="start">자본재 수입 증감</text><text x="363" y="338" font-size="43" fill="#008477" font-weight="800" text-anchor="start">+116억 달러</text><text x="363" y="393" font-size="20" fill="#829299" font-weight="500" text-anchor="start">8월 대비 · 통관 기준</text><rect x="644" y="219" width="277" height="227" rx="5" fill="#ffffff"/><rect x="644" y="219" width="277" height="6" rx="0" fill="#c7363e"/><text x="664" y="264" font-size="25" fill="#103c4b" font-weight="700" text-anchor="start">실질 상품적자</text><text x="664" y="338" font-size="43" fill="#c7363e" f