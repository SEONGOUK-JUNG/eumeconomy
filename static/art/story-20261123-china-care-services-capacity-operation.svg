<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" role="img"><title>중국 돌봄 확충의 서로 다른 목표</title><desc>2030년 목표·각 카드 기준 독립·보육 이용률은2025년 대비 개선폭 · 중국 4개 부처 실시방안 2026.11.23 공개</desc><g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif"><rect x="0" y="0" width="1000" height="660" rx="0" fill="#f2f6f5"/><rect x="0" y="0" width="1000" height="10" rx="0" fill="#008477"/><text x="45" y="50" font-size="19" fill="#008477" font-weight="700" text-anchor="start">이음경제 · 기사별 데이터 그래픽</text><text x="45" y="93" font-size="31" fill="#103c4b" font-weight="800" text-anchor="start">중국 돌봄 확충의 서로 다른 목표</text><text x="45" y="164" font-size="21" fill="#819399" font-weight="500" text-anchor="start">2030년 목표·각 카드 기준 독립·보육 이용률은2025년 대비 개선폭</text><rect x="50.0" y="245" width="280.0" height="290" rx="4" fill="white"/><text x="68.0" y="282" font-size="23" fill="#103c4b" font-weight="700" text-anchor="start">양로기관 병상 구성</text><text x="68.0" y="375" font-size="37" fill="#008477" font-weight="800" text-anchor="start">73%</text><text x="68.0" y="417" font-size="21" fill="#819399" font-weight="500" text-anchor="start">2030년 간호형 병상</text><text x="68.0" y="443" font-size="21" fill="#819399" font-weight="500" text-anchor="start"> / 양로기관 병상</text><rect x="350.0" y="245" width="280.0" height="290" rx="4" fill="white"/><text x="368.0" y="282" font-size="23" fill="#103c4b" font-weight="700" text-anchor="start">지역사회 양로시설</text><text x="368.0" y="375" font-size="37" fill="#008477" font-weight="800" text-anchor="start">70%</text><text x="368.0" y="417" font-size="21" fill="#819399" font-weight="500" text-anchor="start">2030년 기관·시설 </text><text x="368.0" y="443" font-size="21" fill="#819399" font-weight="500" text-anchor="start">보급률 목표</text><rect x="650.0" y="245" width="280.0" height="290" rx="4" fill="white"/><text x="668.0" y="282" font-size="23" fill="#103c4b" font-weight="700" text-anchor="start">3세 미만 보육 이용</text><text x="668.0" y="375" font-size="37" fill="#008477" font-weight="800" text-anchor="start">+6%p</text><text x="668.0" y="417" font-size="21" fill="#819399" font-weight="500" text-anchor="start">2030년 이용률·20</text><text x="668.0" y="443" font-size="21" fill="#819399" font-weight="500" text-anchor="start">25년 대비 개선폭</text><line x1="45" y1="585" x2="955" y2="585" stroke="#cbd8d2" stroke-width="2"/><text x="45" y="616" font-size="19" fill="#819399" font-weight="500" text-anchor="start">중국 4개 부처 실시방안 2026.11.23 공개</text></g></svg>