<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 440" role="img" aria-labelledby="title desc">
<title id="title">전국 인구의 연령구조 변화 전망</title>
<desc id="desc">2025년과 2045년 연앙 기준 생산연령인구 및 고령인구 비중 비교. 2045년은 국회예산정책처 전망이다.</desc>
<rect width="840" height="440" fill="#f6f8fa"/>
<g font-family="Malgun Gothic, sans-serif" fill="#18334c">
<text x="28" y="40" font-size="24">줄어드는 생산연령 비중, 늘어나는 고령 비중</text>
<text x="28" y="73" font-size="15">전국 · 연앙인구 기준 % · 2045년은 전망</text>
<text x="28" y="132" font-size="17">생산연령 2025</text>
<rect x="240" y="110" width="415.20000000000005" height="30" fill="#287a88"/>
<text x="670.2" y="132" font-size="19">69.2%</text>
<text x="28" y="198" font-size="17">생산연령 2045 전망</text>
<rect x="240" y="176" width="331.79999999999995" height="30" fill="#287a88"/>
<text x="586.8" y="198" font-size="19">55.3%</text>
<text x="28" y="264" font-size="17">65세 이상 2025</text>
<rect x="240" y="242" width="124.19999999999999" height="30" fill="#ad6148"/>
<text x="379.2" y="264" font-size="19">20.7%</text>
<text x="28" y="330" font-size="17">65세 이상 2045 전망</text>
<rect x="240" y="308" width="226.79999999999998" height="30" fill="#ad6148"/>
<text x="481.79999999999995" y="330" font-size="19">37.8%</text>
<line x1="240" y1="100" x2="240" y2="350" stroke="#738394"/>
<text x="28" y="402" font-size="14">출처: 국회예산정책처, 지역인구전망 2026~2045, 2026.11.18</text>
</g></svg>
