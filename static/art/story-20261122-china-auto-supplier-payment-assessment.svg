<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" role="img"><title>부품대금 지급의 서로 다른 기준</title><desc>기한은 중소기업·비율은 가격협상 중 거래별 기준·합산 금지 · 중국 공신부 지급 지침 2026.9.7·평가 발표11.16</desc><g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif"><rect x="0" y="0" width="1000" height="660" rx="0" fill="#f2f6f5"/><rect x="0" y="0" width="1000" height="10" rx="0" fill="#008477"/><text x="45" y="50" font-size="19" fill="#008477" font-weight="700" text-anchor="start">이음경제 · 기사별 데이터 그래픽</text><text x="45" y="93" font-size="31" fill="#103c4b" font-weight="800" text-anchor="start">부품대금 지급의 서로 다른 기준</text><text x="45" y="164" font-size="21" fill="#819399" font-weight="500" text-anchor="start">기한은 중소기업·비율은 가격협상 중 거래별 기준·합산 금지</text><rect x="50.0" y="245" width="280.0" height="290" rx="4" fill="white"/><text x="68.0" y="282" font-size="23" fill="#103c4b" font-weight="700" text-anchor="start">중소기업 지급</text><text x="68.0" y="375" font-size="37" fill="#008477" font-weight="800" text-anchor="start">최장 60일</text><text x="68.0" y="417" font-size="21" fill="#819399" font-weight="500" text-anchor="start">검수 합격 후·30일 </text><text x="68.0" y="443" font-size="21" fill="#819399" font-weight="500" text-anchor="start">이내 지급 장려</text><rect x="350.0" y="245" width="280.0" height="290" rx="4" fill="white"/><text x="368.0" y="282" font-size="23" fill="#103c4b" font-weight="700" text-anchor="start">연속 거래 협상 중</text><text x="368.0" y="375" font-size="37" fill="#008477" font-weight="800" text-anchor="start">90% 이상</text><text x="368.0" y="417" font-size="21" fill="#819399" font-weight="500" text-anchor="start">일반 기준·최근 유효 </text><text x="368.0" y="443" font-size="21" fill="#819399" font-weight="500" text-anchor="start">계약가격을 참고한 우선</text><text x="368.0" y="469" font-size="21" fill="#819399" font-weight="500" text-anchor="start"> 지급</text><rect x="650.0" y="245" width="280.0" height="290" rx="4" fill="white"/><text x="668.0" y="282" font-size="23" fill="#103c4b" font-weight="700" text-anchor="start">비연속 거래 협상 중</text><text x="668.0" y="375" font-size="37" fill="#008477" font-weight="800" text-anchor="start">70% 이상</text><text x="668.0" y="417" font-size="21" fill="#819399" font-weight="500" text-anchor="start">업계 평균가 또는 개발</text><text x="668.0" y="443" font-size="21" fill="#819399" font-weight="500" text-anchor="start"> 지정단가 참고</text><line x1="45" y1="585" x2="955" y2="585" stroke="#cbd8d2" stroke-width="2"/><text x="45" y="616" font-size="19" fill="#819399" font-weight="500" text-anchor="start">중국 공신부 지급 지침 2026.9.7·평가 발표11.16</text></g></svg>