<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc"><title id="title">지역재투자 평가 개편안</title><desc id="desc">은행권 15곳 · 향후 최종등급 상대평가 배분 / 올해 결과와 구분. 출처: 금융위원회 2026.11.27 · 제도개선 계획, 저축은행에 적용한 표 아님</desc><rect width="1000" height="650" fill="#f6f5ef"/><g font-family="Malgun Gothic, Noto Sans KR, sans-serif"><text x="44" y="56" font-size="18" fill="#397562">이음경제  |  자료로 보는 경제</text><text x="44" y="109" font-size="31" fill="#163144">지역재투자 평가 개편안</text><text x="44" y="149" font-size="20" fill="#163144">은행권 15곳 · 향후 최종등급 상대평가 배분 / 올해 결과와 구분</text><text x="45" y="218" font-size="22" fill="#163144">최우수</text><rect x="235" y="191" width="78" height="34" rx="3" fill="#397562"/><text x="329" y="217" font-size="22" fill="#163144">1개 은행</text><text x="45" y="270" font-size="22" fill="#163144">우수</text><rect x="235" y="243" width="312" height="34" rx="3" fill="#397562"/><text x="563" y="269" font-size="22" fill="#163144">4개 은행</text><text x="45" y="322" font-size="22" fill="#163144">양호</text><rect x="235" y="295" width="390" height="34" rx="3" fill="#397562"/><text x="641" y="321" font-size="22" fill="#163144">5개 은행</text><text x="45" y="374" font-size="22" fill="#163144">다소미흡</text><rect x="235" y="347" width="234" height="34" rx="3" fill="#397562"/><text x="485" y="373" font-size="22" fill="#163144">3개 은행</text><text x="45" y="426" font-size="22" fill="#163144">미흡</text><rect x="235" y="399" width="156" height="34" rx="3" fill="#397562"/><text x="407" y="425" font-size="22" fill="#163144">2개 은행</text><text x="44" y="510" font-size="25" fill="#163144">배점 조정안  |  서민대출 15 → 20점</text><text x="44" y="550" font-size="25" fill="#163144">                         인프라 투자 15 → 10점</text><text x="44" y="600" font-size="17" fill="#536270">출처: 금융위원회 2026.11.27 · 제도개선 계획, 저축은행에 적용한 표 아님</text></g></svg>