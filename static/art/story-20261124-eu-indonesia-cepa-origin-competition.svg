<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" role="img"><title>EU·인도네시아 CEPA 적용 범위</title><desc>서명과 적용 구분·양허는 수입 방향별 별도 기준 · EU 11.18·21 / 인도네시아 무역부11.21</desc><g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif"><rect x="0" y="0" width="1000" height="660" rx="0" fill="#f2f6f5"/><rect x="0" y="0" width="1000" height="10" rx="0" fill="#008477"/><text x="45" y="50" font-size="19" fill="#008477" font-weight="700" text-anchor="start">이음경제 · 기사별 데이터 그래픽</text><text x="45" y="93" font-size="31" fill="#103c4b" font-weight="800" text-anchor="start">EU·인도네시아 CEPA 적용 범위</text><text x="45" y="164" font-size="21" fill="#819399" font-weight="500" text-anchor="start">서명과 적용 구분·양허는 수입 방향별 별도 기준</text><rect x="50.0" y="245" width="280.0" height="290" rx="4" fill="white"/><text x="68.0" y="282" font-size="23" fill="#103c4b" font-weight="700" text-anchor="start">적용 절차</text><text x="68.0" y="375" font-size="37" fill="#008477" font-weight="800" text-anchor="start">2027년 초 예상</text><text x="68.0" y="417" font-size="21" fill="#819399" font-weight="500" text-anchor="start">내부 절차·상호 통지 </text><text x="68.0" y="443" font-size="21" fill="#819399" font-weight="500" text-anchor="start">후 잠정 적용</text><rect x="350.0" y="245" width="280.0" height="290" rx="4" fill="white"/><text x="368.0" y="282" font-size="23" fill="#103c4b" font-weight="700" text-anchor="start">인도네시아 수입</text><text x="368.0" y="375" font-size="37" fill="#008477" font-weight="800" text-anchor="start">98.5% 철폐</text><text x="368.0" y="417" font-size="21" fill="#819399" font-weight="500" text-anchor="start">EU산 관세품목·단계적</text><text x="368.0" y="443" font-size="21" fill="#819399" font-weight="500" text-anchor="start"> 양허 포함</text><rect x="650.0" y="245" width="280.0" height="290" rx="4" fill="white"/><text x="668.0" y="282" font-size="23" fill="#103c4b" font-weight="700" text-anchor="start">EU 수입</text><text x="668.0" y="375" font-size="29" fill="#008477" font-weight="800" text-anchor="start">90.4% 즉시 철폐</text><text x="668.0" y="417" font-size="21" fill="#819399" font-weight="500" text-anchor="start">인도네시아산 관세품목·</text><text x="668.0" y="443" font-size="21" fill="#819399" font-weight="500" text-anchor="start">적용 개시 때</text><line x1="45" y1="585" x2="955" y2="585" stroke="#cbd8d2" stroke-width="2"/><text x="45" y="616" font-size="19" fill="#819399" font-weight="500" text-anchor="start">EU 11.18·21 / 인도네시아 무역부11.21</text></g></svg>