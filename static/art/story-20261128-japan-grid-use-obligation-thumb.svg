<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="t d"><title id="t">일본 전력망 사용 책임</title><desc id="d">11월27일 약관 변경 인가 신청. 중간 용량 반환과 최종 비용 정산.</desc><rect width="640" height="360" fill="#143c4d"/><g font-family="Malgun Gothic,sans-serif"><text x="35" y="56" font-size="18" fill="#bfd9df">일본 송배전 이용약관 · 11월 27일 신청</text><text x="35" y="111" font-size="32" fill="white" font-weight="700">전력 확보에 사용 책임</text><rect x="35" y="151" width="270" height="119" rx="10" fill="#dceae7"/><rect x="335" y="151" width="270" height="119" rx="10" fill="#eee0c7"/><text x="170" y="190" text-anchor="middle" font-size="18" fill="#173c3a">단계별 중간</text><text x="170" y="235" text-anchor="middle" font-size="29" fill="#17665b" font-weight="700">용량 반환</text><text x="470" y="190" text-anchor="middle" font-size="18" fill="#574427">일반·단계별 최종</text><text x="470" y="235" text-anchor="middle" font-size="29" fill="#9c6624" font-weight="700">비용 정산</text><text x="35" y="319" font-size="18" fill="white">인가 후 2027년 4월 1일 시행 예정</text></g></svg>