<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" role="img"><title>같은 MW, 적용 대상은 다른 세 기준</title><desc>0.25·5는 AI 장비전력 인정 경로·50은 비수도권 계약전력 평가 면제안 · 과기정통부 2026.11.20 시행령·시행규칙 입법예고 보도자료</desc><g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif"><rect x="0" y="0" width="1000" height="660" rx="0" fill="#f2f6f5"/><rect x="0" y="0" width="1000" height="10" rx="0" fill="#008477"/><text x="45" y="50" font-size="19" fill="#008477" font-weight="700" text-anchor="start">이음경제 · 기사별 데이터 그래픽</text><text x="45" y="93" font-size="31" fill="#103c4b" font-weight="800" text-anchor="start">같은 MW, 적용 대상은 다른 세 기준</text><text x="45" y="164" font-size="21" fill="#819399" font-weight="500" text-anchor="start">0.25·5는 AI 장비전력 인정 경로·50은 비수도권 계약전력 평가 면제안</text><rect x="50" y="245" width="280" height="290" rx="4" fill="white"/><text x="68" y="282" font-size="23" fill="#103c4b" font-weight="700" text-anchor="start">인정 경로 ①</text><text x="68" y="375" font-size="37" fill="#008477" font-weight="800" text-anchor="start">0.25MW 이상</text><text x="68" y="417" font-size="21" fill="#819399" font-weight="500" text-anchor="start">AI 장비전력·전체 I</text><text x="68" y="443" font-size="21" fill="#819399" font-weight="500" text-anchor="start">T전력의 50% 이상 </text><text x="68" y="469" font-size="21" fill="#819399" font-weight="500" text-anchor="start">병행</text><rect x="350" y="245" width="280" height="290" rx="4" fill="white"/><text x="368" y="282" font-size="23" fill="#103c4b" font-weight="700" text-anchor="start">인정 경로 ②</text><text x="368" y="375" font-size="37" fill="#008477" font-weight="800" text-anchor="start">5MW 이상</text><text x="368" y="417" font-size="21" fill="#819399" font-weight="500" text-anchor="start">AI 장비전력·별도 규</text><text x="368" y="443" font-size="21" fill="#819399" font-weight="500" text-anchor="start">모 기준</text><rect x="650" y="245" width="280" height="290" rx="4" fill="white"/><text x="668" y="282" font-size="23" fill="#103c4b" font-weight="700" text-anchor="start">비수도권 면제안</text><text x="668" y="375" font-size="37" fill="#008477" font-weight="800" text-anchor="start">50MW 이하</text><text x="668" y="417" font-size="21" fill="#819399" font-weight="500" text-anchor="start">계약전력·전력계통영향평</text><text x="668" y="443" font-size="21" fill="#819399" font-weight="500" text-anchor="start">가 면제 대상안</text><line x1="45" y1="585" x2="955" y2="585" stroke="#cbd8d2" stroke-width="2"/><text x="45" y="616" font-size="19" fill="#819399" font-weight="500" text-anchor="start">과기정통부 2026.11.20 시행령·시행규칙 입법예고 보도자료</text></g></svg>