<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" role="img"><title>화장품 주의표시와 용기 개선의 차이</title><desc>조사 4개 제품·서로 다른 기준의 카드로 합산 불가 · 한국소비자원 2026.8.4 안전주의보 2·5쪽</desc><g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif"><rect x="0" y="0" width="1000" height="660" rx="0" fill="#f2f6f5"/><rect x="0" y="0" width="1000" height="10" rx="0" fill="#008477"/><text x="45" y="50" font-size="19" fill="#008477" font-weight="700" text-anchor="start">이음경제 · 기사별 데이터 그래픽</text><text x="45" y="93" font-size="31" fill="#103c4b" font-weight="800" text-anchor="start">화장품 주의표시와 용기 개선의 차이</text><text x="45" y="164" font-size="21" fill="#819399" font-weight="500" text-anchor="start">조사 4개 제품·서로 다른 기준의 카드로 합산 불가</text><rect x="50.0" y="245" width="280.0" height="290" rx="4" fill="white"/><text x="68.0" y="282" font-size="23" fill="#103c4b" font-weight="700" text-anchor="start">주의사항 표시</text><text x="68.0" y="375" font-size="37" fill="#008477" font-weight="800" text-anchor="start">4개 제품 모두</text><text x="68.0" y="417" font-size="21" fill="#819399" font-weight="500" text-anchor="start">포장재 또는 판매페이지</text><text x="68.0" y="443" font-size="21" fill="#819399" font-weight="500" text-anchor="start"> 표시·낱개 인지 어려</text><text x="68.0" y="469" font-size="21" fill="#819399" font-weight="500" text-anchor="start">움</text><rect x="350.0" y="245" width="280.0" height="290" rx="4" fill="white"/><text x="368.0" y="282" font-size="23" fill="#103c4b" font-weight="700" text-anchor="start">생산 중단 계획</text><text x="368.0" y="375" font-size="37" fill="#008477" font-weight="800" text-anchor="start">3개 사업자</text><text x="368.0" y="417" font-size="21" fill="#819399" font-weight="500" text-anchor="start">8월 발표 당시 회신·</text><text x="368.0" y="443" font-size="21" fill="#819399" font-weight="500" text-anchor="start">현재 완료 통계 아님</text><rect x="650.0" y="245" width="280.0" height="290" rx="4" fill="white"/><text x="668.0" y="282" font-size="23" fill="#103c4b" font-weight="700" text-anchor="start">용기 개선 계획</text><text x="668.0" y="375" font-size="37" fill="#008477" font-weight="800" text-anchor="start">1개 사업자</text><text x="668.0" y="417" font-size="21" fill="#819399" font-weight="500" text-anchor="start">8월 발표 당시 회신·</text><text x="668.0" y="443" font-size="21" fill="#819399" font-weight="500" text-anchor="start">주요 4개 플랫폼 조사</text><line x1="45" y1="585" x2="955" y2="585" stroke="#cbd8d2" stroke-width="2"/><text x="45" y="616" font-size="19" fill="#819399" font-weight="500" text-anchor="start">한국소비자원 2026.8.4 안전주의보 2·5쪽</text></g></svg>