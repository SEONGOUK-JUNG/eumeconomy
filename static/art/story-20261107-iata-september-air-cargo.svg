<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img"><title>항공화물 수요, 공급보다 빠른 증가</title><desc>2026년 9월 · 전년 동월 대비 · 전 세계. 자료: IATA 9월 항공화물시장 분석 · 수익 증가율이나 이익률 아님</desc><g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif"><rect x="0" y="0" width="960" height="600" rx="0" fill="#f2f6f5"/><rect x="0" y="0" width="960" height="12" rx="0" fill="#008477"/><text x="42" y="64" font-size="19" fill="#008477" font-weight="700" text-anchor="start">EUM ECONOMY  ·  기사별 데이터 그래픽</text><text x="42" y="112" font-size="35" fill="#103c4b" font-weight="800" text-anchor="start">항공화물 수요, 공급보다 빠른 증가</text><text x="42" y="151" font-size="22" fill="#829299" font-weight="500" text-anchor="start">2026년 9월 · 전년 동월 대비 · 전 세계</text><line x1="360" y1="211" x2="360" y2="506" stroke="#aabbb6" stroke-width="2"/><text x="45" y="251" font-size="27" fill="#103c4b" font-weight="700" text-anchor="start">수요 · CTK</text><rect x="360" y="223" width="350.0" height="37" rx="5" fill="#008477"/><text x="894" y="251" font-size="28" fill="#008477" font-weight="700" text-anchor="end">+7.7%</text><text x="45" y="320" font-size="27" fill="#103c4b" font-weight="700" text-anchor="start">공급 · ACTK</text><rect x="360" y="292" width="122.72727272727273" height="37" rx="5" fill="#008477"/><text x="894" y="320" font-size="28" fill="#008477" font-weight="700" text-anchor="end">+2.7%</text><text x="70" y="446" font-size="38" fill="#008477" font-weight="800" text-anchor="start">증가율 격차 5.0%포인트</text><text x="70" y="492" font-size="24" fill="#829299" font-weight="500" text-anchor="start">CTK = 수송 수요  /  ACTK = 가용 공급</text><line x1="42" y1="543" x2="918" y2="543" stroke="#d1dcd9" stroke-width="2"/><text x="42" y="576" font-size="19" fill="#829299" font-weight="500" text-anchor="start">자료: IATA 9월 항공화물시장 분석 · 수익 증가율이나 이익률 아님</text></g></svg>