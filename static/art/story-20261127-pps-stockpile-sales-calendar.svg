<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc"><title id="title">비축금속, 중단 사유와 일정 구분</title><desc id="desc">2026년 11월 27일 확인 · 품목별 공지와 연말 계획. 출처: 조달청 비축물자 · 현금 구매 절차 / 외상 구매는 지급보증 등 별도 조건</desc><rect width="1000" height="650" fill="#f6f5ef"/><g font-family="Malgun Gothic, Noto Sans KR, sans-serif"><text x="44" y="56" font-size="18" fill="#397562">이음경제  |  자료로 보는 경제</text><text x="44" y="109" font-size="31" fill="#163144">비축금속, 중단 사유와 일정 구분</text><text x="44" y="149" font-size="20" fill="#163144">2026년 11월 27일 확인 · 품목별 공지와 연말 계획</text><rect x="44" y="195" width="912" height="76" rx="7" fill="#e2e8e2"/><text x="62" y="225" font-size="24" fill="#163144">주석 99.90%</text><text x="62" y="254" font-size="21" fill="#163144">11월 27일부터 상시방출 중단 · 구매물량 입고 지연</text><rect x="44" y="285" width="912" height="76" rx="7" fill="#e2e8e2"/><text x="62" y="315" font-size="24" fill="#163144">구리</text><text x="62" y="344" font-size="21" fill="#163144">11월 26일~12월 1일 일반 상시방출 중단 · 주간 한도 소진</text><rect x="44" y="375" width="912" height="76" rx="7" fill="#e2e8e2"/><text x="62" y="405" font-size="24" fill="#163144">연말 결산</text><text x="62" y="434" font-size="21" fill="#163144">12월 16일~2027년 1월 12일 판매중지 예정</text><text x="44" y="512" font-size="25" fill="#163144">배정신청 → 현금 납부 확인 → 배정통지 → 창고 인수</text><text x="44" y="550" font-size="22" fill="#163144">판매가격 표시 ≠ 배정 확정  |  알루미늄 업체 한도: 통합 40톤/주</text><text x="44" y="600" font-size="17" fill="#536270">출처: 조달청 비축물자 · 현금 구매 절차 / 외상 구매는 지급보증 등 별도 조건</text></g></svg>