<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc"><title id="title">핵심광물 대체, 후보보다 양산 검증</title><desc id="desc">JRC 분야별 보고서 · 방안 수는 기술성숙도·상용화와 별개. 출처: EU JRC 전자·승용차·건설 원보고서 및 2026.11.18 종합 발표</desc><rect width="1000" height="650" fill="#f6f5ef"/><g font-family="Malgun Gothic, Noto Sans KR, sans-serif"><text x="44" y="56" font-size="18" fill="#397562">이음경제  |  자료로 보는 경제</text><text x="44" y="109" font-size="31" fill="#163144">핵심광물 대체, 후보보다 양산 검증</text><text x="44" y="149" font-size="20" fill="#163144">JRC 분야별 보고서 · 방안 수는 기술성숙도·상용화와 별개</text><text x="44" y="225" font-size="24" fill="#163144">전자</text><rect x="220" y="198" width="384.8" height="36" rx="3" fill="#397562"/><text x="619.8" y="225" font-size="24" fill="#163144">74개 방안</text><text x="44" y="293" font-size="24" fill="#163144">승용차</text><rect x="220" y="266" width="473.2" height="36" rx="3" fill="#397562"/><text x="708.2" y="293" font-size="24" fill="#163144">91개 방안</text><text x="44" y="361" font-size="24" fill="#163144">건설</text><rect x="220" y="334" width="223.6" height="36" rx="3" fill="#397562"/><text x="458.6" y="361" font-size="24" fill="#163144">43개 방안</text><text x="44" y="438" font-size="23" fill="#163144">3개 분야 합계 208개 · 전체 266개 검토와 범위 구분</text><text x="44" y="490" font-size="23" fill="#163144">재료 후보 → 기능·신뢰성 검증 → 공정 통합 → 양산·고객 승인</text><text x="44" y="537" font-size="21" fill="#163144">검토 방안 수 ≠ 상용 제품 수 · 승용차 91개 중 62개는 TRL 7 이상</text><text x="44" y="600" font-size="17" fill="#536270">출처: EU JRC 전자·승용차·건설 원보고서 및 2026.11.18 종합 발표</text></g></svg>