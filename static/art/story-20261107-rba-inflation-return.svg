<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img"><title>호주, 금리 인상과 엇갈린 표결</title><desc>11월 3일 결정 · 새 금리 적용 11월 4일. 자료: RBA 11월 3일 정책결정 · 표결은 이번 결정의 찬반</desc><g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif"><rect x="0" y="0" width="960" height="600" rx="0" fill="#f2f6f5"/><rect x="0" y="0" width="960" height="12" rx="0" fill="#008477"/><text x="42" y="64" font-size="19" fill="#008477" font-weight="700" text-anchor="start">EUM ECONOMY  ·  기사별 데이터 그래픽</text><text x="42" y="112" font-size="35" fill="#103c4b" font-weight="800" text-anchor="start">호주, 금리 인상과 엇갈린 표결</text><text x="42" y="151" font-size="22" fill="#829299" font-weight="500" text-anchor="start">11월 3일 결정 · 새 금리 적용 11월 4일</text><text x="70" y="269" font-size="58" fill="#829299" font-weight="800" text-anchor="start">4.60%</text><text x="423" y="267" font-size="62" fill="#008477" font-weight="800" text-anchor="start">→</text><text x="605" y="269" font-size="62" fill="#c7363e" font-weight="800" text-anchor="start">4.85%</text><text x="70" y="312" font-size="24" fill="#829299" font-weight="500" text-anchor="start">종전 기준금리</text><text x="605" y="312" font-size="24" fill="#c7363e" font-weight="500" text-anchor="start">0.25%포인트 인상</text><text x="70" y="380" font-size="26" fill="#103c4b" font-weight="700" text-anchor="start">정책위원 9명 표결</text><rect x="70" y="408" width="540" height="52" rx="5" fill="#008477"/><rect x="610" y="408" width="270" height="52" rx="5" fill="#829299"/><text x="340" y="444" font-size="27" fill="white" font-weight="700" text-anchor="middle">인상 6명</text><text x="745" y="444" font-size="27" fill="white" font-weight="700" text-anchor="middle">동결 3명</text><line x1="42" y1="543" x2="918" y2="543" stroke="#d1dcd9" stroke-width="2"/><text x="42" y="576" font-size="19" fill="#829299" font-weight="500" text-anchor="start">자료: RBA 11월 3일 정책결정 · 표결은 이번 결정의 찬반</text></g></svg>