<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320" role="img"><title>한화 관련 제재 추가 집행 중단</title><g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif"><rect x="0" y="0" width="480" height="320" rx="0" fill="#f2f6f5"/><rect x="0" y="0" width="10" height="320" rx="0" fill="#008477"/><text x="32" y="43" font-size="21" fill="#008477" font-weight="700" text-anchor="start">이음경제 · 데이터</text><text x="32" y="115" font-size="52" fill="#103c4b" font-weight="800" text-anchor="start">2개월</text><text x="32" y="160" font-size="25" fill="#103c4b" font-weight="700" text-anchor="start">한화 관련 제재 추가 집행 중</text><text x="32" y="190" font-size="25" fill="#103c4b" font-weight="700" text-anchor="start">단</text><rect x="32" y="220" width="130" height="40" rx="4" fill="#dcebe6"/><text x="42" y="247" font-size="20" fill="#008477" font-weight="700" text-anchor="start">법인 지정</text><rect x="177" y="220" width="130" height="40" rx="4" fill="#dcebe6"/><text x="187" y="247" font-size="20" fill="#008477" font-weight="700" text-anchor="start">추가 유예</text><rect x="322" y="220" width="130" height="40" rx="4" fill="#dcebe6"/><text x="332" y="247" font-size="20" fill="#008477" font-weight="700" text-anchor="start">건조 일정</text><text x="32" y="299" font-size="17" fill="#819399" font-weight="500" text-anchor="start">원자료 · 기간은 기사 도표에 표시</text></g></svg>