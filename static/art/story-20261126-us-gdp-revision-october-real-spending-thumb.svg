<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 610" role="img" aria-labelledby="title desc"><title id="title">미국 성장과 소비, 다른 기간·다른 움직임</title><desc id="desc">BEA | 2026.11.25 발표</desc><rect width="1000" height="610" fill="#f5f2e9"/><g font-family="Malgun Gothic, sans-serif" fill="#122b3c"><text x="44" y="63" font-size="30" font-weight="700">미국 성장과 소비, 다른 기간·다른 움직임</text><text x="44" y="103" font-size="19">BEA | 2026.11.25 발표</text><rect x="32" y="135" width="936" height="126" rx="8" fill="#fff"/><text x="52" y="164" font-size="19">3분기 실질 GDP · 전기 대비 연율</text><text x="52" y="205" font-size="29" font-weight="700">4.3%</text><text x="52" y="240" font-size="18">속보 3.4% → 잠정 4.3%</text><rect x="32" y="277" width="936" height="126" rx="8" fill="#fff"/><text x="52" y="306" font-size="19">10월 실질 처분가능소득 · 전월 대비</text><text x="52" y="347" font-size="29" font-weight="700">+0.5%</text><text x="52" y="382" font-size="18">물가 조정 후 소득 증가</text><rect x="32" y="419" width="936" height="126" rx="8" fill="#fff"/><text x="52" y="448" font-size="19">10월 실질 PCE · 전월 대비</text><text x="52" y="489" font-size="29" font-weight="700">0.0%*</text><text x="52" y="524" font-size="18">*반올림값, 원문상 0.1% 미만 감소</text><text x="44" y="589" font-size="16">이음경제 | 비교 기간과 단위가 다른 지표는 합산하지 않음</text></g></svg>