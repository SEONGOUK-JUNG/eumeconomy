<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" role="img"><title>에어버스 연말 인도 과제</title><desc>2026년 대수·월평균, 11~12월은 연간 목표 약 870대 달성 필요량 · 에어버스 10월 주문·인도, 9개월 실적·연간 목표</desc><g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif"><rect x="0" y="0" width="1000" height="660" rx="0" fill="#f2f6f5"/><rect x="0" y="0" width="1000" height="10" rx="0" fill="#008477"/><text x="45" y="50" font-size="19" fill="#008477" font-weight="700" text-anchor="start">이음경제 · 기사별 데이터 그래픽</text><text x="45" y="93" font-size="31" fill="#103c4b" font-weight="800" text-anchor="start">에어버스 연말 인도 과제</text><text x="45" y="164" font-size="21" fill="#819399" font-weight="500" text-anchor="start">2026년 대수·월평균, 11~12월은 연간 목표 약 870대 달성 필요량</text><text x="50" y="222" font-size="22" fill="#008477" font-weight="700" text-anchor="start">인도 대수·목표 필요량</text><line x1="360" y1="238" x2="360" y2="535" stroke="#c2d2cb" stroke-width="2"/><text x="50" y="263.0" font-size="24" fill="#103c4b" font-weight="700" text-anchor="start">1~10월 월평균</text><rect x="360" y="240.0" width="174.57831325301206" height="32" rx="3" fill="#008477"/><text x="920" y="261.0" font-size="23" fill="#008477" font-weight="700" text-anchor="end">62.1</text><text x="50" y="358.0" font-size="24" fill="#103c4b" font-weight="700" text-anchor="start">10월 인도실적</text><rect x="360" y="335.0" width="208.0321285140562" height="32" rx="3" fill="#008477"/><text x="920" y="356.0" font-size="23" fill="#008477" font-weight="700" text-anchor="end">74</text><text x="50" y="453.0" font-size="24" fill="#103c4b" font-weight="700" text-anchor="start">연말 필요 월평균</text><rect x="360" y="430.0" width="350.0" height="32" rx="3" fill="#008477"/><text x="920" y="451.0" font-size="23" fill="#008477" font-weight="700" text-anchor="end">124.5</text><text x="920" y="566" font-size="20" fill="#819399" font-weight="500" text-anchor="end">단위: 대</text><line x1="45" y1="585" x2="955" y2="585" stroke="#cbd8d2" stroke-width="2"/><text x="45" y="616" font-size="19" fill="#819399" font-weight="500" text-anchor="start">에어버스 10월 주문·인도, 9개월 실적·연간 목표</text></g></svg>