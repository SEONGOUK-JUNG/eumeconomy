<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" role="img"><title>생산지가 가르는 조달 평가가격</title><desc>2026년 시행 정부조달 정책 적용 예시 · 동일 견적 100만 위안 가정 · 가격 평가액, 만 위안 · 중국 국무원 국판발〔2025〕34호 · 20% 평가 공제 적용 가상 계산</desc><g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif"><rect x="0" y="0" width="1000" height="660" rx="0" fill="#f2f6f5"/><rect x="0" y="0" width="1000" height="10" rx="0" fill="#008477"/><text x="45" y="50" font-size="19" fill="#008477" font-weight="700" text-anchor="start">이음경제 · 기사별 데이터 그래픽</text><text x="45" y="93" font-size="31" fill="#103c4b" font-weight="800" text-anchor="start">생산지가 가르는 조달 평가가격</text><text x="45" y="164" font-size="21" fill="#819399" font-weight="500" text-anchor="start">2026년 시행 정부조달 정책 적용 예시 · 동일 견적 100만 위안 가정 </text><text x="45" y="189" font-size="21" fill="#819399" font-weight="500" text-anchor="start">· 가격 평가액, 만 위안</text><text x="50" y="222" font-size="22" fill="#008477" font-weight="700" text-anchor="start">동일 견적을 가정한 평가액</text><line x1="360" y1="238" x2="360" y2="535" stroke="#c2d2cb" stroke-width="2"/><text x="50" y="263.0" font-size="24" fill="#103c4b" font-weight="700" text-anchor="start">수입품</text><rect x="360" y="240.0" width="350.0" height="32" rx="3" fill="#008477"/><text x="920" y="261.0" font-size="23" fill="#008477" font-weight="700" text-anchor="end">100</text><text x="50" y="405.5" font-size="24" fill="#103c4b" font-weight="700" text-anchor="start">적격 중국산</text><rect x="360" y="382.5" width="280.0" height="32" rx="3" fill="#008477"/><text x="920" y="403.5" font-size="23" fill="#008477" font-weight="700" text-anchor="end">80</text><text x="920" y="566" font-size="20" fill="#819399" font-weight="500" text-anchor="end">단위: 만 위안</text><line x1="45" y1="585" x2="955" y2="585" stroke="#cbd8d2" stroke-width="2"/><text x="45" y="616" font-size="19" fill="#819399" font-weight="500" text-anchor="start">중국 국무원 국판발〔2025〕34호 · 20% 평가 공제 적용 가상 계산</text></g></svg>