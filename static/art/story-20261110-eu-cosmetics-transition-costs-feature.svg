<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" role="img"><title>EU 화장품 규제는 서로 다른 기한에 적용된다</title><desc>향료 구표시·비타민 A·미세플라스틱의 별도 전환 기한 · 품목별 예외 적용 · EU 2023/1545·2024/996·2023/2055 · 품목별 범위·예외는 본문 참조</desc><g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif"><rect x="0" y="0" width="1000" height="660" rx="0" fill="#f2f6f5"/><rect x="0" y="0" width="1000" height="10" rx="0" fill="#008477"/><text x="45" y="50" font-size="19" fill="#008477" font-weight="700" text-anchor="start">이음경제 · 기사별 데이터 그래픽</text><text x="45" y="93" font-size="31" fill="#103c4b" font-weight="800" text-anchor="start">EU 화장품 규제는 서로 다른 기한에 적용된다</text><text x="45" y="164" font-size="21" fill="#819399" font-weight="500" text-anchor="start">향료 구표시·비타민 A·미세플라스틱의 별도 전환 기한 · 품목별 예외 적용</text><rect x="50" y="235" width="280" height="138" rx="4" fill="white"/><text x="65" y="260" font-size="18" fill="#008477" font-weight="700" text-anchor="start">1</text><text x="65" y="289" font-size="22" fill="#103c4b" font-weight="700" text-anchor="start">2026.07.31</text><text x="65" y="314" font-size="22" fill="#103c4b" font-weight="700" text-anchor="start"> 향료 구표시 출시</text><text x="65" y="339" font-size="22" fill="#103c4b" font-weight="700" text-anchor="start"> 유예 종료</text><rect x="350" y="235" width="280" height="138" rx="4" fill="white"/><text x="365" y="260" font-size="18" fill="#008477" font-weight="700" text-anchor="start">2</text><text x="365" y="289" font-size="22" fill="#103c4b" font-weight="700" text-anchor="start">2027.05.01</text><text x="365" y="314" font-size="22" fill="#103c4b" font-weight="700" text-anchor="start"> 비타민 A 미준수</text><text x="365" y="339" font-size="22" fill="#103c4b" font-weight="700" text-anchor="start">품 공급 제한</text><rect x="650" y="235" width="280" height="138" rx="4" fill="white"/><text x="665" y="260" font-size="18" fill="#008477" font-weight="700" text-anchor="start">3</text><text x="665" y="289" font-size="22" fill="#103c4b" font-weight="700" text-anchor="start">2027.10.17</text><text x="665" y="314" font-size="22" fill="#103c4b" font-weight="700" text-anchor="start"> 일반 씻어내는 제</text><text x="665" y="339" font-size="22" fill="#103c4b" font-weight="700" text-anchor="start">품 미세입자 제한</text><rect x="50" y="387" width="280" height="138" rx="4" fill="white"/><text x="65" y="412" font-size="18" fill="#008477" font-weight="700" text-anchor="start">4</text><text x="65" y="441" font-size="22" fill="#103c4b" font-weight="700" text-anchor="start">2028.07.31</text><text x="65" y="466" font-size="22" fill="#103c4b" font-weight="700" text-anchor="start"> 향료 구표시 재고</text><text x="65" y="491" font-size="22" fill="#103c4b" font-weight="700" text-anchor="start"> 공급 유예 종료</text><rect x="350" y="387" width="280" height="138" rx="4" fill="white"/><text x="365" y="412" font-size="18" fill="#008477" font-weight="700" text-anchor="start">5</text><text x="365" y="441" font-size="22" fill="#103c4b" font-weight="700" text-anchor="start">2029.10.17</text><text x="365" y="466" font-size="22" fill="#103c4b" font-weight="700" text-anchor="start"> 일반 씻어내지 않</text><text x="365" y="491" font-size="22" fill="#103c4b" font-weight="700" text-anchor="start">는 제품 미세입자 </text><text x="365" y="516" font-size="22" fill="#103c4b" font-weight="700" text-anchor="start">제한</text><rect x="650" y="387" width="280" height="138" rx="4" fill="white"/><text x="665" y="412" font-size="18" fill="#008477" font-weight="700" text-anchor="start">6</text><text x="665" y="441" font-size="22" fill="#103c4b" font-weight="700" text-anchor="start">2035.10.17</text><text x="665" y="466" font-size="22" fill="#103c4b" font-weight="700" text-anchor="start"> 메이크업·입술·손</text><text x="665" y="491" font-size="22" fill="#103c4b" font-weight="700" text-anchor="start">톱 미세입자 제한</text><text x="920" y="566" font-size="20" fill="#819399" font-weight="500" text-anchor="end">단위: 년·월·일</text><line x1="45" y1="585" x2="955" y2="585" stroke="#cbd8d2" stroke-width="2"/><text x="45" y="616" font-size="19" fill="#819399" font-weight="500" text-anchor="start">EU 2023/1545·2024/996·2023/2055 · 품목별 범위·예외는 본</text><text x="45" y="639" font-size="19" fill="#819399" font-weight="500" text-anchor="start">문 참조</text></g></svg>