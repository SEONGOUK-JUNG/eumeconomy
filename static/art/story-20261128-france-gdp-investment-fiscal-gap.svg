<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">프랑스, 소비 증가와 투자 감소의 엇갈림</title><desc id="desc">2026년 3분기 가계소비는 전분기 대비 0.3% 증가하고 총고정투자는 0.9% 감소했다. 정부 수입 증가액은 10억 유로, 지출 증가액은 37억 유로다.</desc><rect width="1200" height="700" fill="#f6f3eb"/><g font-family="Malgun Gothic, sans-serif" fill="#182e3b"><text x="60" y="75" font-size="36" font-weight="700">프랑스의 소비·투자, 서로 다른 방향</text><text x="60" y="115" font-size="21">2026년 3분기 · INSEE 11월 27일 상세치</text><rect x="55" y="155" width="525" height="420" rx="14" fill="#fff"/><rect x="605" y="155" width="540" height="420" rx="14" fill="#fff"/><text x="80" y="200" font-size="24" font-weight="700">실질 수요 · 전분기 대비 %</text><line x1="360" y1="240" x2="360" y2="510" stroke="#9ba9ae" stroke-width="2"/><text x="80" y="275" font-size="23">가계소비</text><rect x="360" y="250" width="48" height="38" fill="#197a80"/><text x="424" y="278" font-size="25">+0.3</text><text x="80" y="375" font-size="23">고정투자</text><rect x="216" y="350" width="144" height="38" fill="#bf614d"/><text x="370" y="378" font-size="25">−0.9</text><text x="80" y="475" font-size="23">실질 GDP</text><rect x="328" y="450" width="32" height="38" fill="#bf614d"/><text x="370" y="478" font-size="25">−0.2</text><text x="630" y="200" font-size="24" font-weight="700">정부 재정 · 전분기 증가액</text><text x="630" y="237" font-size="19">단위: 억 유로 · 명목 금액</text><text x="630" y="285" font-size="23">수입</text><rect x="720" y="258" width="100" height="42" fill="#197a80"/><text x="835" y="288" font-size="25">10</text><text x="630" y="380" font-size="23">지출</text><rect x="720" y="353" width="370" height="42" fill="#bf614d"/><text x="1055" y="430" font-size="25">37</text><text x="630" y="490" font-size="23" font-weight="700">증가액 차이: 27억 유로</text><text x="630" y="530" font-size="20">분기 재정적자: GDP의 5.6%</text><text x="60" y="620" font-size="20">소비 증가가 투자 위축을 상쇄…재정 수입보다 빠르게 늘어난 지출</text><text x="60" y="658" font-size="17" fill="#526772">출처: INSEE 국민계정 2026년 3분기 상세치 · 양쪽 도표의 단위와 척도는 다름</text></g></svg>