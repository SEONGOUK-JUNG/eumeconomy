<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="미래대응기금 제출안 순운용 재원 배분"><rect width="1200" height="720" fill="#f5f2e9"/><g font-family="Malgun Gothic, sans-serif" fill="#182c35"><text x="55" y="65" font-size="32" font-weight="700">미래대응기금, 사업비와 적립금의 구분</text><text x="55" y="112" font-size="22">2027년 제출안 · 계정 간 거래 제외 순운용 162조 2,998억 원</text><text x="55" y="175" font-size="22">4대 계정 사업비</text><text x="1100" y="175" text-anchor="end" font-size="24" font-weight="700">45조 3,625억 원</text><rect x="55" y="193" width="1040" height="22" fill="#e3e1d8"/><rect x="55" y="193" width="290.678" height="22" fill="#17756d"/><text x="55" y="280" font-size="22">여유운용·공자기금 예탁</text><text x="1100" y="280" text-anchor="end" font-size="24" font-weight="700">104조 3,614억 원</text><rect x="55" y="298" width="1040" height="22" fill="#e3e1d8"/><rect x="55" y="298" width="668.737" height="22" fill="#577c91"/><text x="55" y="385" font-size="22">일반회계 전출</text><text x="1100" y="385" text-anchor="end" font-size="24" font-weight="700">12조 5,000억 원</text><rect x="55" y="403" width="1040" height="22" fill="#e3e1d8"/><rect x="55" y="403" width="80.099" height="22" fill="#ac764e"/><text x="55" y="490" font-size="22">예수이자·기금 운영비</text><text x="1100" y="490" text-anchor="end" font-size="24" font-weight="700">759억 원</text><rect x="55" y="508" width="1040" height="22" fill="#e3e1d8"/><rect x="55" y="508" width="0.500" height="22" fill="#6b6c69"/><text x="55" y="620" font-size="21">합계: 453,625 + 1,043,614 + 125,000 + 759 = 1,622,998억 원</text><text x="55" y="660" font-size="18">출처: 국회예산정책처 2027년도 예산안 총괄분석Ⅱ · 정부 제출안 분석</text><text x="55" y="695" font-size="18">여유운용에 공자기금 예탁 1조 원 포함 · 확정 집행실적 아님</text></g></svg>