<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="t d"><title id="t">금융행정 쇄신 절차와 일정</title><desc id="d">11월 27일 금융위 발표의 인허가, 검사, 제재 변화</desc><rect width="1100" height="650" fill="#f4f1e9"/><g font-family="Malgun Gothic,sans-serif" fill="#17333b"><text x="50" y="60" font-size="19">이음경제 · 한국경제</text><text x="50" y="115" font-size="34" font-weight="700">금융감독, 절차의 예측가능성을 높인다</text><text x="50" y="155" font-size="20">2026년 11월 27일 발표 · 후속 규정과 매뉴얼 개정 추진</text>
<rect x="50" y="195" width="320" height="270" rx="12" fill="#173f49"/><rect x="390" y="195" width="320" height="270" rx="12" fill="#245560"/><rect x="730" y="195" width="320" height="270" rx="12" fill="#316a72"/>
<g fill="white" font-size="21"><text x="75" y="240" font-size="27">인허가</text><text x="75" y="295">중단 사건 → 재개 원칙</text><text x="75" y="340">보완 지연 → 심사종결</text><text x="75" y="410" font-size="18">심사종결: 2027년 1분기</text><text x="415" y="240" font-size="27">검사</text><text x="415" y="295">핵심·취약부문 중심</text><text x="415" y="340">7일 통지 → 7영업일</text><text x="415" y="410" font-size="18">주요 개정: 2027년 2분기</text><text x="755" y="240" font-size="27">제재</text><text x="755" y="295">현장 필사 → 사본 교부</text><text x="755" y="340">자율 시정 → 감경 확대</text><text x="755" y="410" font-size="18">열람 개정: 2027년 2분기</text></g>
<text x="50" y="525" font-size="22">2027년 3분기 목표: 심사중단제 개선 · 업무 디지털화</text><text x="50" y="567" font-size="22">2027년 4분기 목표: 회사별 제재 결과 검색 개선</text><text x="50" y="615" font-size="16">자료: 금융위·금감원. 일정은 추진 목표이며 시행 완료를 뜻하지 않음.</text></g></svg>