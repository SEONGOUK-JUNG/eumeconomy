<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">베트남 자본시장: 조달액과 시장규모의 차이</title><desc id="desc">2026~2030년 중장기 조달 목표 5,400조 동, 2030년 주식 시가총액 GDP 대비 120%, 채권잔액 최소 58%. 정부의 정책 목표이며 실제 조달 완료액이 아니다.</desc>
<rect width="1200" height="720" fill="#f4f1e9"/>
<g font-family="Malgun Gothic, sans-serif" fill="#172d36">
<text x="64" y="75" font-size="23" fill="#a65036">ASIA ECONOMY · 2026.11.28</text>
<text x="64" y="135" font-size="42" font-weight="700">베트남 자본시장, 돈의 흐름과 규모</text>
<text x="64" y="181" font-size="24">증권업 30주년 정책지시 · 정부 발표 2026년 11월 27일</text>
<rect x="64" y="225" width="1072" height="172" rx="12" fill="#173d4b"/>
<text x="96" y="271" fill="white" font-size="26">기간 중 중장기 자금조달 목표</text>
<text x="96" y="342" fill="#f6d593" font-size="59" font-weight="700">5,400조 동</text>
<text x="645" y="302" fill="white" font-size="28">2026~2030년</text>
<text x="645" y="350" fill="#d8e7e7" font-size="24">5개 연도 단순평균 1,080조 동</text>
<rect x="64" y="423" width="522" height="173" rx="12" fill="#e0e7e4"/>
<rect x="614" y="423" width="522" height="173" rx="12" fill="#e6dfd4"/>
<text x="96" y="468" font-size="24">2030년 주식 시가총액 목표</text>
<text x="96" y="540" font-size="48" font-weight="700">GDP의 120%</text>
<text x="646" y="468" font-size="24">2030년 채권잔액 목표</text>
<text x="646" y="540" font-size="48" font-weight="700">GDP의 최소 58%</text>
<text x="64" y="641" font-size="22">조달액은 기간의 흐름 · 시가총액과 채권잔액은 시점의 규모</text>
<text x="64" y="681" font-size="18" fill="#526267">자료: 베트남 정부포털 · 목표 수치이며 집행 실적이 아님 · 연평균은 단순 계산</text>
</g></svg>