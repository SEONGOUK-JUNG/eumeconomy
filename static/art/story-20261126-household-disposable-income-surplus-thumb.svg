<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 610" role="img" aria-labelledby="title desc"><title id="title">가계 소득 증가에도 처분가능소득 감소</title><desc id="desc">국가데이터처 | 가구당 월평균 · 전년 같은 분기 비교</desc><rect width="1000" height="610" fill="#f5f2e9"/><g font-family="Malgun Gothic, sans-serif" fill="#122b3c"><text x="44" y="63" font-size="30" font-weight="700">가계 소득 증가에도 처분가능소득 감소</text><text x="44" y="103" font-size="19">국가데이터처 | 가구당 월평균 · 전년 같은 분기 비교</text><rect x="32" y="135" width="936" height="126" rx="8" fill="#fff"/><text x="52" y="164" font-size="19">소득 - 비소비지출 = 처분가능소득</text><text x="52" y="205" font-size="29" font-weight="700">548.0 - 117.4 = 430.6만원</text><text x="52" y="240" font-size="18">2026년 3분기 · 공표 반올림액</text><rect x="32" y="277" width="936" height="126" rx="8" fill="#fff"/><text x="52" y="306" font-size="19">처분가능소득 - 소비 = 흑자액</text><text x="52" y="347" font-size="29" font-weight="700">430.6 - 303.0 = 127.6만원</text><text x="52" y="382" font-size="18">2026년 3분기 · 공표 반올림액</text><rect x="32" y="419" width="936" height="126" rx="8" fill="#fff"/><text x="52" y="448" font-size="19">2025년 3분기 흑자액 → 2026년 3분기</text><text x="52" y="489" font-size="29" font-weight="700">143.7 → 127.6만원</text><text x="52" y="524" font-size="18">공표액 차이 -16.1만원 / 공식 증감률 -11.2%</text><text x="44" y="589" font-size="16">이음경제 | 비교 기간과 단위가 다른 지표는 합산하지 않음</text></g></svg>