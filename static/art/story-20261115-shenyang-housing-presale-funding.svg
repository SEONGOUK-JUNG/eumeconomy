<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" role="img"><title>선양 신규 사업의 선분양·자금관리 절차</title><desc>2026년11월13일 시행의견 / 8월28일 이후 토지매각 공고 사업·값은 절차 순번 · 선양시 부동산국 시행의견 제1·4항</desc><g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif"><rect x="0" y="0" width="1000" height="660" rx="0" fill="#f2f6f5"/><rect x="0" y="0" width="1000" height="10" rx="0" fill="#008477"/><text x="45" y="50" font-size="19" fill="#008477" font-weight="700" text-anchor="start">이음경제 · 기사별 데이터 그래픽</text><text x="45" y="93" font-size="31" fill="#103c4b" font-weight="800" text-anchor="start">선양 신규 사업의 선분양·자금관리 절차</text><text x="45" y="164" font-size="21" fill="#819399" font-weight="500" text-anchor="start">2026년11월13일 시행의견 / 8월28일 이후 토지매각 공고 사업·값은 </text><text x="45" y="189" font-size="21" fill="#819399" font-weight="500" text-anchor="start">절차 순번</text><rect x="50" y="235" width="280" height="138" rx="4" fill="white"/><text x="65" y="260" font-size="18" fill="#008477" font-weight="700" text-anchor="start">1</text><text x="65" y="289" font-size="22" fill="#103c4b" font-weight="700" text-anchor="start">골조 완성</text><rect x="350" y="235" width="280" height="138" rx="4" fill="white"/><text x="365" y="260" font-size="18" fill="#008477" font-weight="700" text-anchor="start">2</text><text x="365" y="289" font-size="22" fill="#103c4b" font-weight="700" text-anchor="start">선분양 신청</text><rect x="650" y="235" width="280" height="138" rx="4" fill="white"/><text x="665" y="260" font-size="18" fill="#008477" font-weight="700" text-anchor="start">3</text><text x="665" y="289" font-size="22" fill="#103c4b" font-weight="700" text-anchor="start">감독계좌 입금</text><rect x="50" y="387" width="280" height="138" rx="4" fill="white"/><text x="65" y="412" font-size="18" fill="#008477" font-weight="700" text-anchor="start">4</text><text x="65" y="441" font-size="22" fill="#103c4b" font-weight="700" text-anchor="start">공정별 인출 신청</text><rect x="350" y="387" width="2