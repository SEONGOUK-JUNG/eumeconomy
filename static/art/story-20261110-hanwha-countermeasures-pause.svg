<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" role="img"><title>제재 유예와 선박 건조의 서로 다른 일정</title><desc>법령 시행일과 기업의 착공·인도 예상 시점 구분; 뒤 두 단계는 예정 · 중국 상무부 2025년 제6·7호·2026년 제4호, 한화 2026.11.2 발표</desc><g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif"><rect x="0" y="0" width="1000" height="660" rx="0" fill="#f2f6f5"/><rect x="0" y="0" width="1000" height="10" rx="0" fill="#008477"/><text x="45" y="50" font-size="19" fill="#008477" font-weight="700" text-anchor="start">이음경제 · 기사별 데이터 그래픽</text><text x="45" y="93" font-size="31" fill="#103c4b" font-weight="800" text-anchor="start">제재 유예와 선박 건조의 서로 다른 일정</text><text x="45" y="164" font-size="21" fill="#819399" font-weight="500" text-anchor="start">법령 시행일과 기업의 착공·인도 예상 시점 구분; 뒤 두 단계는 예정</text><rect x="50" y="235" width="280" height="138" rx="4" fill="white"/><text x="65" y="260" font-size="18" fill="#008477" font-weight="700" text-anchor="start">1</text><text x="65" y="289" font-size="22" fill="#103c4b" font-weight="700" text-anchor="start">2025.10.14</text><text x="65" y="314" font-size="22" fill="#103c4b" font-weight="700" text-anchor="start"> 제재 지정</text><rect x="350" y="235" width="280" height="138" rx="4" fill="white"/><text x="365" y="260" font-size="18" fill="#008477" font-weight="700" text-anchor="start">2</text><text x="365" y="289" font-size="22" fill="#103c4b" font-weight="700" text-anchor="start">2025.11.10</text><text x="365" y="314" font-size="22" fill="#103c4b" font-weight="700" text-anchor="start"> 1년 집행 중단</text><rect x="650" y="235" width="280" height="138" rx="4" fill="white"/><text x="665" y="260" font-size="18" fill="#008477" font-weight="700" text-anchor="start">3</text><text x="665" y="289" font-size="22" fill="#103c4b" font-weight="700" text-anchor="start">2026.11.10</text><text x="665" y="314" font-size="22" fill="#103c4b" font-weight="700" text-anchor="start"> 2개월 추가 중단</text><rect x="50" y="387" width="280" height="138" rx="4" fill="white"/><text x="65" y="412" font-size="18" fill="#008477" font-weight="700" text-anchor="start">4</text><text x="65" y="441" font-size="22" fill="#103c4b" font-weight="700" text-anchor="start">2027년 4분기 </text><text x="65" y="466" font-size="22" fill="#103c4b" font-weight="700" text-anchor="start">착공 가능 일정</text><rect x="350" y="387" width="280" height="138" rx="4" fill="white"/><text x="365" y="412" font-size="18" fill="#008477" font-weight="700" text-anchor="start">5</text><text x="365" y="441" font-size="22" fill="#103c4b" font-weight="700" text-anchor="start">2030년 사업 첫</text><text x="365" y="466" font-size="22" fill="#103c4b" font-weight="700" text-anchor="start"> 함정 인도 예상</text><text x="920" y="566" font-size="20" fill="#819399" font-weight="500" text-anchor="end">단위: 일정</text><line x1="45" y1="585" x2="955" y2="585" stroke="#cbd8d2" stroke-width="2"/><text x="45" y="616" font-size="19" fill="#819399" font-weight="500" text-anchor="start">중국 상무부 2025년 제6·7호·2026년 제4호, 한화 2026.11.2 발표</text></g></svg>