<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img"><title>셸, 액화량과 판매량의 다른 방향</title><desc>2026년 2분기 → 3분기 · LNG 물량 비교. 자료: 셸 3분기 공식 실적 · LNG 물량은 부문 이익과 별도 지표</desc><g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif"><rect x="0" y="0" width="960" height="600" rx="0" fill="#f2f6f5"/><rect x="0" y="0" width="960" height="12" rx="0" fill="#008477"/><text x="42" y="64" font-size="19" fill="#008477" font-weight="700" text-anchor="start">EUM ECONOMY  ·  기사별 데이터 그래픽</text><text x="42" y="112" font-size="35" fill="#103c4b" font-weight="800" text-anchor="start">셸, 액화량과 판매량의 다른 방향</text><text x="42" y="151" font-size="22" fill="#829299" font-weight="500" text-anchor="start">2026년 2분기 → 3분기 · LNG 물량 비교</text><text x="46" y="194" font-size="22" fill="#829299" font-weight="500" text-anchor="start">2분기</text><text x="246" y="194" font-size="22" fill="#008477" font-weight="500" text-anchor="start">3분기</text><text x="45" y="247" font-size="25" fill="#103c4b" font-weight="700" text-anchor="start">액화량</text><rect x="255" y="225" width="196.76363636363635" height="23" rx="3" fill="#829299"/><text x="765" y="246" font-size="23" fill="#829299" font-weight="700" text-anchor="start">773만 톤</text><rect x="255" y="261" width="189.12727272727273" height="23" rx="3" fill="#008477"/><text x="765" y="282" font-size="23" fill="#008477" font-weight="700" text-anchor="start">743만 톤</text><text x="45" y="343" font-size="25" fill="#103c4b" font-weight="700" text-anchor="start">판매량</text><rect x="255" y="321" width="457.1636363636364" height="23" rx="3" fill="#829299"/><text x="765" y="342" font-size="23" fill="#829299" font-weight="700" text-anchor="start">1,796만 톤</text><rect x="255" y="357" width="490.0" height="23" rx="3" fill="#008477"/><text x="765" y="378" font-size="23" fill="#008477" font-weight="700" text-anchor="start">1,925만 톤</text><text x="45" y="485" font-size="24" fill="#829299" font-weight="500" text-anchor="star