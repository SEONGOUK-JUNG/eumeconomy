<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 375" role="img" aria-labelledby="title desc"><title id="title">ASML, 기존 장비 매출 늘어도 비중은 소폭 하락</title><desc id="desc">출처: ASML 2026년 10월 14일 실적 발표 · 3분기 확정 발표치, 4분기 전망 아님</desc><rect width="900" height="375" fill="#f5f7f8"/><g font-family="sans-serif" fill="#182b3a"><text x="28" y="42" font-size="25">ASML, 기존 장비 매출 늘어도 비중은 소폭 하락</text>
<rect x="28" y="78" width="8" height="55" fill="#267a83"/><text x="52" y="100" font-size="21">전체 매출 · 2분기 → 3분기</text><text x="380" y="100" font-size="24" font-weight="bold">9,326 → 11,662</text><text x="52" y="126" font-size="16">단위: 백만 유로 · 2026년 분기 실적</text>
<rect x="28" y="153" width="8" height="55" fill="#617f9a"/><text x="52" y="175" font-size="21">기존 장비 관리 매출</text><text x="380" y="175" font-size="24" font-weight="bold">2,762 → 3,289</text><text x="52" y="201" font-size="16">단위: 백만 유로 · 순서비스와 현장 옵션 합계</text>
<rect x="28" y="228" width="8" height="55" fill="#a16e35"/><text x="52" y="250" font-size="21">전체 매출에서 차지하는 비중</text><text x="380" y="250" font-size="24" font-weight="bold">29.6% → 28.2%</text><text x="52" y="276" font-size="16">공개 매출로 계산 · 비중 감소는 매출 감소와 다름</text>
<text x="28" y="355" font-size="14">출처: ASML 2026년 10월 14일 실적 발표 · 3분기 확정 발표치, 4분기 전망 아님</text></g></svg>
