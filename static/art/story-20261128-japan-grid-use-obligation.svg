<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">일본 전력망 이용약관 변경 신청</title><desc id="desc">단계별 계약 중간 단계에는 용량 반환, 일반 계약과 단계별 최종 단계에는 비용 정산. 인가 후 2027년 4월 1일 시행 예정.</desc><rect width="1200" height="680" fill="#f4f1e9"/><g font-family="Malgun Gothic, sans-serif"><text x="60" y="72" font-size="34" font-weight="700" fill="#132e3d">전력망 확보에서 사용계획 이행으로</text><text x="60" y="113" font-size="21" fill="#53616a">도쿄전력PG·홋카이도전력네트워크 | 2026.11.27 인가 신청</text><rect x="60" y="157" width="1080" height="83" rx="12" fill="#143c4d"/><text x="600" y="192" text-anchor="middle" font-size="23" fill="white">계획대로 계약전력이 설정되지 않는 경우</text><text x="600" y="222" text-anchor="middle" font-size="18" fill="#b9d6df">월별 실제 사용량과 계약전력 설정은 구분</text><path d="M600 240V275H315V305M600 275H885V305" stroke="#426679" stroke-width="4" fill="none"/><rect x="60" y="305" width="510" height="185" rx="12" fill="#dceae7"/><rect x="630" y="305" width="510" height="185" rx="12" fill="#eee0c7"/><text x="315" y="351" text-anchor="middle" font-size="23" fill="#173c3a">단계별 계약의 중간 단계</text><text x="315" y="410" text-anchor="middle" font-size="35" font-weight="700" fill="#17665b">확보 용량 반환</text><text x="315" y="457" text-anchor="middle" font-size="19" fill="#35534e">다른 수요가 활용할 수 있도록 개방</text><text x="885" y="347" text-anchor="middle" font-size="22" fill="#574427">일반 계약·단계별 최종 계약</text><text x="885" y="410" text-anchor="middle" font-size="35" font-weight="700" fill="#9c6624">수요 규모별 비용 정산</text><text x="885" y="457" text-anchor="middle" font-size="19" fill="#65513a">구체적 조건은 인가 약관에서 확인</text><rect x="60" y="527" width="1080" height="62" rx="10" fill="white"/><text x="600" y="567" text-anchor="middle" font-size="23" fill="#173a4a">신청 → 경제산업상 인가 → 2027.4.1 시행 예정</text><text x="60" y="631" font-size="17" fill="#59636a">출처: 양사 11월 27일 공식 발표 | 신청 단계이며 승인·시행 완료가 아님</text></g></svg>