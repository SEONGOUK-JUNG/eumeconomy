<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" role="img"><title>외환 증가와 금 평가액 감소</title><desc>중국 2026년 10월 말 잔액의 9월 말 대비 변화; 합계는 외환·금 등을 포함 · 중국 국가외환관리국(SAFE), 공식 준비자산 2026년 표</desc><g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif"><rect x="0" y="0" width="1000" height="660" rx="0" fill="#f2f6f5"/><rect x="0" y="0" width="1000" height="10" rx="0" fill="#008477"/><text x="45" y="50" font-size="19" fill="#008477" font-weight="700" text-anchor="start">이음경제 · 기사별 데이터 그래픽</text><text x="45" y="93" font-size="31" fill="#103c4b" font-weight="800" text-anchor="start">외환 증가와 금 평가액 감소</text><text x="45" y="164" font-size="21" fill="#819399" font-weight="500" text-anchor="start">중국 2026년 10월 말 잔액의 9월 말 대비 변화; 합계는 외환·금 등을</text><text x="45" y="189" font-size="21" fill="#819399" font-weight="500" text-anchor="start"> 포함</text><text x="50" y="210" font-size="22" fill="#008477" font-weight="700" text-anchor="start">2026년 9월 말→10월 말 증감</text><line x1="620" y1="238" x2="620" y2="535" stroke="#c2d2cb" stroke-width="2"/><text x="50" y="263.0" font-size="24" fill="#103c4b" font-weight="700" text-anchor="start">외환보유액</text><rect x="620" y="240.0" width="67.68648427452356" height="32" rx="3" fill="#008477"/><text x="920" y="261.0" font-size="23" fill="#008477" font-weight="700" text-anchor="end">49.27</text><text x="50" y="358.0" font-size="24" fill="#103c4b" font-weight="700" text-anchor="start">금 평가액</text><rect x="385.0" y="335.0" width="235.0" height="32" rx="3" fill="#c7363e"/><text x="920" y="356.0" font-size="23" fill="#c7363e" font-weight="700" text-anchor="end">-171.06</text><text x="50" y="453.0" font-size="24" fill="#103c4b" font-weight="700" text-anchor="start">공식 준비자산 합계</text><rect x="457.013913246814" y="430.0" width="162.98608675318602" height="32" rx="3" fill="#c7363e"/><text x="920" y="451.0" font-size="23" fill="#c7363e" font-weight="700" text-anchor="end">-118.64</text><text x="920" y="566" font-siz