<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc"><title id="title">중국 자본시장…세 경로의 정책</title><desc id="desc">국무원 상무회의 2026.11.27 · 정책 방향, 집행액 아님; 신규 기금·투입 총액·기관별 의무 비중은 미발표; 출처: 중국정부망 회의 결과 · 생태환경부 공식 전재</desc><rect width="1000" height="650" fill="#f5f4ed"/><g font-family="Malgun Gothic, sans-serif"><text x="44" y="52" font-size="18" fill="#297665">이음경제 | 정책과 데이터</text><text x="44" y="106" font-size="32" fill="#183c4e">중국 자본시장…세 경로의 정책</text><text x="44" y="146" font-size="19" fill="#52636a">국무원 상무회의 2026.11.27 · 정책 방향, 집행액 아님</text><rect x="44" y="182" width="912" height="58" rx="5" fill="#e0eae3"/><text x="62" y="218" font-size="22" fill="#183c4e">유동성 대응</text><text x="324" y="218" font-size="22" fill="#183c4e">후이진의 준 증시안정기금 기능 개선</text><rect x="44" y="264" width="912" height="58" rx="5" fill="#e5e8e8"/><text x="62" y="300" font-size="22" fill="#183c4e">장기 투자</text><text x="324" y="300" font-size="22" fill="#183c4e">보험·기업연금·사회보장기금 참여 지원</text><rect x="44" y="346" width="912" height="58" rx="5" fill="#e0eae3"/><text x="62" y="382" font-size="22" fill="#183c4e">기업·감독</text><text x="324" y="382" font-size="22" fill="#183c4e">배당·자사주 매입 / 회계 부정·불법 매각 단속</text><text x="44" y="568" font-size="21" fill="#183c4e">신규 기금·투입 총액·기관별 의무 비중은 미발표</text><text x="44" y="617" font-size="17" fill="#52636a">출처: 중국정부망 회의 결과 · 생태환경부 공식 전재</text></g></svg>