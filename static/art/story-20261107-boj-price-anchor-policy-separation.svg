<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img"><title>일본은행, 금리와 자산 처분의 시간차</title><desc>2026년 10월 30일 결정 · ETF 확대는 시행 예정. 자료: 일본은행 10월 30일 결정문 · ETF 장부가와 시가 구분</desc><g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif"><rect x="0" y="0" width="960" height="600" rx="0" fill="#f2f6f5"/><rect x="0" y="0" width="960" height="12" rx="0" fill="#008477"/><text x="42" y="64" font-size="19" fill="#008477" font-weight="700" text-anchor="start">EUM ECONOMY  ·  기사별 데이터 그래픽</text><text x="42" y="112" font-size="35" fill="#103c4b" font-weight="800" text-anchor="start">일본은행, 금리와 자산 처분의 시간차</text><text x="42" y="151" font-size="22" fill="#829299" font-weight="500" text-anchor="start">2026년 10월 30일 결정 · ETF 확대는 시행 예정</text><rect x="42" y="219" width="277" height="227" rx="5" fill="#ffffff"/><rect x="42" y="219" width="277" height="6" rx="0" fill="#103c4b"/><text x="62" y="264" font-size="25" fill="#103c4b" font-weight="700" text-anchor="start">정책금리</text><text x="62" y="338" font-size="43" fill="#103c4b" font-weight="800" text-anchor="start">1.25%</text><text x="62" y="393" font-size="20" fill="#829299" font-weight="500" text-anchor="start">동결 · 현행 정책금리</text><rect x="343" y="219" width="277" height="227" rx="5" fill="#ffffff"/><rect x="343" y="219" width="277" height="6" rx="0" fill="#008477"/><text x="363" y="264" font-size="25" fill="#103c4b" font-weight="700" text-anchor="start">ETF 연간 매각</text><text x="363" y="338" font-size="43" fill="#008477" font-weight="800" text-anchor="start">8,600억 엔</text><text x="363" y="393" font-size="20" fill="#829299" font-weight="500" text-anchor="start">장부가 기준 · 확대 계획</text><rect x="644" y="219" width="277" height="227" rx="5" fill="#ffffff"/><rect x="644" y="219" width="277" height="6" rx="0" fill="#c7363e"/><text x="664" y="264" font-size="25" fill="#103c4b" font-weight="700" text-anchor="start">확대 시행</text><text x="664" y="338" font-size="43" fill="#c7363e" font-weight="800" text-anchor="start">2027.01</text><text x="664" y="393" font-size="20" fill="#829299" font-weight="500" text-anchor="start">현재 시행과 구분</text><line x1="75" y1="490" x2="875" y2="490" stroke="#008477" stroke-width="4"/><text x="75" y="523" font-size="22" fill="#103c4b" font-weight="500" text-anchor="start">2026.10 결정</text><text x="875" y="523" font-size="22" fill="#103c4b" font-weight="700" text-anchor="end">2027.01 시행 예정</text><line x1="42" y1="543" x2="918" y2="543" stroke="#d1dcd9" stroke-width="2"/><text x="42" y="576" font-size="19" fill="#829299" font-weight="500" text-anchor="start">자료: 일본은행 10월 30일 결정문 · ETF 장부가와 시가 구분</text></g></svg>