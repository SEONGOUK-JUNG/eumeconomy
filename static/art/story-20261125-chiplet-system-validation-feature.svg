<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 375" role="img" aria-labelledby="title desc"><title id="title">UCIe, 연결 속도에서 시스템 통합으로 범위 확대</title><desc id="desc">출처: UCIe 컨소시엄 2.0·3.0·4.0 공식 발표 및 기능 설명</desc><rect width="900" height="375" fill="#f5f7f8"/><g font-family="sans-serif" fill="#182b3a"><text x="28" y="42" font-size="25">UCIe, 연결 속도에서 시스템 통합으로 범위 확대</text>
<rect x="28" y="78" width="8" height="55" fill="#267a83"/><text x="52" y="100" font-size="21">2.0 · 2024년 8월</text><text x="380" y="100" font-size="24" font-weight="bold">관리·검사·디버깅</text><text x="52" y="126" font-size="16">여러 칩의 상태와 검사 체계 · 공식 규격 발표</text>
<rect x="28" y="153" width="8" height="55" fill="#617f9a"/><text x="52" y="175" font-size="21">3.0 · 2025년 8월</text><text x="380" y="175" font-size="24" font-weight="bold">48 / 64 GT/s</text><text x="52" y="201" font-size="16">초당 전송 횟수 단위 · 시스템 처리량과 구분</text>
<rect x="28" y="228" width="8" height="55" fill="#a16e35"/><text x="52" y="250" font-size="21">4.0 · 2026년 11월</text><text x="380" y="250" font-size="24" font-weight="bold">시스템 관리·보안</text><text x="52" y="276" font-size="16">메모리 연결과 상태 보고 등 · 양산 보급률을 뜻하지 않음</text>
<text x="28" y="355" font-size="14">출처: UCIe 컨소시엄 2.0·3.0·4.0 공식 발표 및 기능 설명</text></g></svg>
