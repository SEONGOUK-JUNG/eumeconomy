<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img"><title>LG생활건강, 부문별 이익 방향은 달라</title><desc>각 부문 영업이익 · 전년 동기와 비교. 자료: LG생활건강 3분기 공식 IR · 부문 합계는 반올림 차이 존재</desc><g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif"><rect x="0" y="0" width="960" height="600" rx="0" fill="#f2f6f5"/><rect x="0" y="0" width="960" height="12" rx="0" fill="#008477"/><text x="42" y="64" font-size="19" fill="#008477" font-weight="700" text-anchor="start">EUM ECONOMY  ·  기사별 데이터 그래픽</text><text x="42" y="112" font-size="35" fill="#103c4b" font-weight="800" text-anchor="start">LG생활건강, 부문별 이익 방향은 달라</text><text x="42" y="151" font-size="22" fill="#829299" font-weight="500" text-anchor="start">각 부문 영업이익 · 전년 동기와 비교</text><text x="45" y="245" font-size="26" fill="#103c4b" font-weight="700" text-anchor="start">뷰티</text><rect x="405.04" y="223" width="174.95999999999998" height="24" rx="3" fill="#829299"/><text x="900" y="245" font-size="25" fill="#829299" font-weight="700" text-anchor="end">-486</text><rect x="540.76" y="259" width="39.24" height="24" rx="3" fill="#008477"/><text x="900" y="281" font-size="25" fill="#008477" font-weight="700" text-anchor="end">-109</text><text x="45" y="343" font-size="26" fill="#103c4b" font-weight="700" text-anchor="start">생활용품</text><rect x="580" y="321" width="115.19999999999999" height="24" rx="3" fill="#829299"/><text x="900" y="343" font-size="25" fill="#829299" font-weight="700" text-anchor="end">+320</text><rect x="580" y="357" width="111.6" height="24" rx="3" fill="#008477"/><text x="900" y="379" font-size="25" fill="#008477" font-weight="700" text-anchor="end">+310</text><text x="45" y="441" font-size="26" fill="#103c4b" font-weight="700" text-anchor="start">음료</text><rect x="580" y="419" width="226.44" height="24" rx="3" fill="#829299"/><text x="900" y="441" font-size="25" fill="#829299" font-weight="700" text-anchor="end">+629</text><rect x="580" y="455" width="181.07999999999998