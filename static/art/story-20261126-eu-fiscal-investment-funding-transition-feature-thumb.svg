<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" role="img" aria-labelledby="title desc"><title id="title">EU 공공투자, 재원과 집행 단계 확인</title><desc id="desc">집행위 11월24일 재정평가와 RRF 연차보고서, 11월26일 정상회의 의제에 근거한 과정도</desc><rect width="1000" height="760" fill="#f5f2e9"/><g font-family="Malgun Gothic, sans-serif" fill="#122b3c"><text x="40" y="58" font-size="30" font-weight="700">EU 공공투자, 재원과 집행 단계 확인</text><text x="40" y="96" font-size="18">2026년 11월 26일 확인 | 전망·협상과 확정 발주를 구분</text><rect x="28" y="123" width="944" height="126" rx="8" fill="#fff"/><text x="48" y="153" font-size="20" font-weight="700">2026 RRF 종료</text><text x="48" y="192" font-size="22">8월 31일 이행 완료 → 9월 30일 최종 지급 요청</text><text x="48" y="229" font-size="17">12월 31일은 집행위 지급 시한 · 새 사업 착수 시점과 구분</text><rect x="28" y="268" width="944" height="126" rx="8" fill="#fff"/><text x="48" y="298" font-size="20" font-weight="700">2027 사업 재원</text><text x="48" y="337" font-size="22">국가예산 · 다른 EU기금 · 공기업 자금 확인</text><text x="48" y="374" font-size="17">기금 송금과 국민경제 지출 · 기업 대금 회수 시점은 다를 수 있음</text><rect x="28" y="413" width="944" height="126" rx="8" fill="#fff"/><text x="48" y="443" font-size="20" font-weight="700">2028~2034 장기예산</text><text x="48" y="482" font-size="22">11월 26~27일 특별 정상회의 협상 의제</text><text x="48" y="519" font-size="17">총액 · 우선순위 배분 · 자체재원 논의 / 타결 결과 아님</text><rect x="28" y="558" width="944" height="126" rx="8" fill="#fff"/><text x="48" y="588" font-size="20" font-weight="700">공급업체 계약 확인</text><text x="48" y="627" font-size="22">사업 승인 → 조달 공고 → 확정 발주 → 검수·지급</text><text x="48" y="664" font-size="17">공공투자 총액 유지가 모든 기존 사업의 지속을 뜻하지 않음</text><text x="40" y="738" font-size="17">출처: EU 집행위 · EU 정상회의 공식 자료 | 이음경제</text></g></svg>